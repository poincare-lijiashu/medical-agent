# W4.5 CI/CD 回归门槛（转型计划书）
#
# 分层设计：
# - pytest：合并强制门槛。测试架构自带离线性（不走 lifespan，不加载 bge-m3、不连
#   Milvus/PG——见 tests/test_review_flow.py 头注），无需模型权重与 services。
# - eval-baseline：run_eval.py 依赖外部资源（Qwen API key、NCBI 在线拉取、Milvus、
#   种子灌库），不适合每次 push 都跑——仅在手动触发（workflow_dispatch）或每周一
#   定时跑，结果 artifact 留档。首次使用前需在仓库 Secrets 配置 QWEN_API_KEY
#   （可选 QWEN_BASE_URL，默认 DashScope 兼容端点）。
# - platform：Java 微服务矩阵（Spring Boot 4）编译 + 单元测试（P0-4 鉴权、P0-5 迁移入口）。
# - postgres-it：真库 SQL 门禁（Testcontainers）——CAS、部分唯一索引、行锁并发语义，
#   mock 单测无法证明（G63）。
# - migration-lint：迁移安全门禁——拦截新迁移里的阻塞式 NOT NULL（G73，评审 §6.15）。
# - helm：部署清单静态校验（helm lint + 三环境 template + compose 叠加层 config），
#   不依赖集群，几十秒内可拦住 95% 的清单错误。
# - image-build：真实构建交付镜像（不推送）——评测 05 P0-2（C3）：此前 CI 不构建镜像，
#   requirements 缺 PyJWT 这类"全新环境才炸"的问题永远发现不了。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"  # 每周一 02:00 UTC：pytest + eval 全量

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # G63：建库步骤必须连得上真实 PG。此前该 job 没有 services，psql 打 127.0.0.1:5432
    # 却不存在 medagent 角色 —— 步骤必失败（要么门禁常红被忽略，要么从未按书面配置跑过）。
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: medagent
          POSTGRES_PASSWORD: medagent123
          POSTGRES_DB: medagent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U medagent"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: "5433"
      PG_USER: medagent
      PG_PASSWORD: medagent123
      PG_DATABASE: medagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch（torch 不固化，CI 按部署矩阵选 CPU 版）
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create isolated test database（W4.1 事故隔离：pytest 连 medagent_test，见 tests/conftest.py）
        run: |
          set -euo pipefail
          export PGPASSWORD="$PG_PASSWORD"
          psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" -tAc \
            "SELECT 1 FROM pg_database WHERE datname='medagent_test'" | grep -q 1 || \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" \
              -c "CREATE DATABASE medagent_test"
      # 第 70 批：红队对抗/安全用例先跑，失败立即阻断（不等到全量跑完才报）。
      # 标记只做筛选，默认全量仍包含这些用例，删除标记不会让门禁"变绿"。
      - name: Red-team gate（-m redteam）
        run: python -m pytest -q -m redteam
      # 第 70 批：覆盖率门禁。本地全量实测 backend 87%（10090 stmts / 1278 miss）；
      # 阈值取 85% 留 2pt 缓冲——低于阈值说明有新增代码完全没被测到，应补测试而不是降阈值。
      - name: Run pytest（覆盖率门禁 backend ≥85%）
        run: python -m pytest -q --cov=backend --cov-report=term-missing:skip-covered --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml --cov-fail-under=85
      # 评测 C5（05-testing-ci P0-4）：覆盖率/用例清单留档，便于回溯"哪次提交开始掉"。
      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    # 评测 C5（05-testing-ci P0-4）：Python 静态门禁（此前完全没有）。
    # 规则集见 ruff.toml：只选"正确性"（E9 语法错误 + F 未定义名/未使用导入等），
    # 基线已清零，因此**阻断**；风格类规则待基线清理后分批启用。
    # 历史收益：本批上线即发现 security_rate.py 的 F823（_last_sweep 缺 global，
    # 内存限流键数 >256 时 UnboundLocalError）。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.14.4
      - name: Ruff（E9 + pyflakes）
        run: python -m ruff check backend tests scripts

  vuln-scan:
    # 评测 C5（05-testing-ci P0-4）：供应链漏洞扫描。
    # 先以"可观测不阻断"上线一个周期（continue-on-error）：存量依赖可能已有
    # 待升级 CVE，直接阻断会让所有提交变红而被绕过——这正是 G63 的教训。
    # 报告作为 artifact 留档；一个周期后按实际结果决定哪些级别切强制。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install scanners
        run: pip install pip-audit==2.9.0
      - name: pip-audit（requirements.txt）
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt --format json --output pip-audit.json
      - name: npm audit（frontend-vue）
        continue-on-error: true
        working-directory: frontend-vue
        run: npm audit --audit-level=high --json > ../npm-audit-vue.json
      - name: npm audit（frontend-console）
        continue-on-error: true
        working-directory: frontend-console
        run: npm audit --audit-level=high --json > ../npm-audit-console.json
      - name: Upload vuln reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-reports
          path: |
            pip-audit.json
            npm-audit-vue.json
            npm-audit-console.json
          if-no-files-found: ignore
          retention-days: 14

  postgres-it:
    # G63：真库 SQL 门禁（Testcontainers + postgres:15-alpine）。
    # mock 单测证明不了 CAS、部分唯一索引、行锁并发语义；此前 *IT 类因 surefire 默认
    # 只收 *Test 而从未执行（Tests run: 0 同样 BUILD SUCCESS），这里显式跑起来。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pre-pull postgres image
        run: docker pull postgres:15-alpine
      - name: Real-DB integration tests (clinical / auth / insurance)
        run: mvn -B -f platform/pom.xml -Ppostgres-it -pl clinical,auth,insurance -am test

  # G73：迁移安全门禁（评审 §6.15）——新迁移若直接 SET NOT NULL / 无默认值
  # ADD COLUMN NOT NULL，会在存量表上取 ACCESS EXCLUSIVE 锁并全表扫描；
  # 已执行的存量迁移记录在 scripts/migration_safety_baseline.txt 里。
  migration-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Migration safety lint
        shell: pwsh
        run: ./scripts/migration_safety_lint.ps1

  platform:
    # Java 微服务矩阵：编译 + 单测（不连数据库：JWT 与网关过滤器均为纯单元测试）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test platform
        run: mvn -B -f platform/pom.xml package

  frontend:
    # 前端质量门禁：TS strict 类型检查 + 生产构建（P0-F 系列整改后纳入强制门槛）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (vue-tsc)
        run: npm run typecheck
      - name: Production build
        run: npm run build

  frontend-ai:
    # 生产托管的前端是 frontend-vue/dist（FastAPI 直接直出），此前后端门禁只构建
    # frontend-console，导致"源码坏了但旧 dist 还能跑"的回归无法被发现（第 130 批实测：
    # main.js 丢失 Element Plus 注册，登录页组件全部退化为未解析标签，CI 全程绿灯）。
    # 本 job 保证：每次提交都从源码真实构建一次，构建失败即红。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  image-build:
    # 评测 05 P0-2（C3）：交付镜像是 Dockerfile + requirements.txt 的真实组合，纯单测
    # 发现不了"缺依赖/系统库"（PyJWT 缺失即典型）。只构建不推送，失败即红。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: medassist-ai-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    # 部署清单静态校验：无需集群，防止 values/模板漂移进入主干
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Helm lint
        run: helm lint deploy/helm/medassist-platform
      - name: Render dev / staging / prod
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            helm template medassist deploy/helm/medassist-platform \
              -n "medassist-$env" \
              -f "deploy/helm/medassist-platform/values-$env.yaml" \
              > "/tmp/manifest-$env.yaml"
            test -s "/tmp/manifest-$env.yaml"
            echo "rendered $env: $(grep -c '^kind: ' "/tmp/manifest-$env.yaml") resources"
          done
      - name: Validate compose overlays
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          NACOS_DB_PASSWORD: ci-only
          NACOS_ADMIN_PASSWORD: ci-only
          NACOS_AUTH_TOKEN: Y2ktb25seS0zMi1ieXRlcy1iYXNlNjQtcGFkZGluZy0=
          NACOS_AUTH_IDENTITY_KEY: ci
          NACOS_AUTH_IDENTITY_VALUE: ci
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f deploy/observability/docker-compose.observability.yml config -q

  eval-baseline:
    # 评测基线门槛：pytest 全绿后，手动/定时才跑（控制 API 成本与外网波动面）
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: medagent
          POSTGRES_PASSWORD: medagent123
          POSTGRES_DB: medagent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U medagent"
          --health-interval 10s --health-timeout 5s --health-retries 5
      etcd:
        image: quay.io/coreos/etcd:v3.5.14
        env:
          ETCD_AUTO_COMPACTION_MODE: revision
          ETCD_AUTO_COMPACTION_RETENTION: "1000"
          ETCD_QUOTA_BACKEND_BYTES: "4294967296"
        cmd: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
      minio:
        image: minio/minio:latest
        env:
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        ports:
          - 9000:9000
        cmd: minio server /minio_data
      milvus:
        image: milvusdb/milvus:v2.4.0
        cmd: ["milvus", "run", "standalone"]
        env:
          ETCD_ENDPOINTS: etcd:2379
          MINIO_ADDRESS: minio:9000
        ports:
          - 19531:19531
          - 19530:19530
    env:
      APP_ENV: development
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ci-only-not-a-prod-secret-0123456789abcdef0123456789abcdef
      AUTH_SEED_DEMO: "true"
      AUTH_DEMO_PASSWORD: Med@2026
      PG_HOST: 127.0.0.1
      PG_PORT: "5433"
      PG_USER: medagent
      PG_PASSWORD: medagent123
      PG_DATABASE: medagent
      MILVUS_URI: http://127.0.0.1:19531
      MILVUS_TOKEN: root:Milvus
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
      MEDICAL_EVAL_USER: doctor01
      MEDICAL_EVAL_PASS: Med@2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Seed KB（离线语料：指南要点 v2 + 教学语料，零外网依赖）
        # 不用 seed_kb_pubmed.py：NCBI 在线拉取对 runner 网络质量敏感（实测间歇
        # Remote end closed），且本地模式方针下 eval 基线应以本地语料为准。
        # 指南要点 67 条 + 教学语料 21 条已实测支撑 baseline 9/9。
        run: |
          python scripts/seed_kb_docs.py v2
          python scripts/seed_kb_local.py
      - name: Start backend
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/healthz && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8001/healthz || (tail -50 uvicorn.log && exit 1)
          sleep 10  # Milvus collection load 稳定
      - name: Run eval baseline（门槛：9/9）
        run: python scripts/run_eval.py
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/results_baseline.json
          if-no-files-found: ignore
