# ============================================================================
# 本地开发专用覆盖（严禁用于 staging/prod）
# 用法：java -jar platform-pharmacy.jar --spring.profiles.active=dev
# ============================================================================
pharmacy:
  empi:
    # 与 EMPI application-dev.yml 的 empi.internal-token 保持一致
    internal-token: medassist-dev-internal-token
  # 入站内部接口令牌（临床医嘱转处方），本地统一放同一个值
  internal-api-token: medassist-dev-internal-token
  # 出站：发药计费/退药冲减调用临床（须与 clinical 的 internal-api-token 一致）
  clinical:
    internal-token: medassist-dev-internal-token

logging:
  level:
    com.medassist: DEBUG
