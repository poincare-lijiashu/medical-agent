server:
  # 网关会把完整权限点列表注入 X-Permissions，管理员令牌可超过 Tomcat 默认 8KB 头上限
  max-http-request-header-size: 32KB
  port: 8087
  shutdown: graceful

spring:
  application:
    name: platform-insurance

  # 目录文件导入（CSV/XML）需要上传：默认 1MB 不够，且与 service 内 5MB 上限双重保护
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    # 评测 04 遗留：JDBC 连接 TLS。默认 prefer（有 TLS 就用、没有回落明文，本地联调不受影响）；
    # staging/prod 由 Helm 注入 PG_SSLMODE=verify-full，并按需注入 PG_SSLROOTCERT（CA 路径）。
    url: "jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}?sslmode=${PG_SSLMODE:prefer}&sslrootcert=${PG_SSLROOTCERT:}"
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: insurance-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  flyway:
    enabled: true
    schemas: insurance_svc
    default-schema: insurance_svc
    locations: classpath:db/migration/insurance
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

# ---- 服务间调用（内网直连，不经网关）----
insurance:
  empi:
    base-url: ${EMPI_INTERNAL_URI:http://127.0.0.1:8082}
    internal-token: ${INTERNAL_API_TOKEN:${INSURANCE_INTERNAL_TOKEN:}}
    timeout: ${EMPI_TIMEOUT:PT2S}
  clinical:
    base-url: ${CLINICAL_INTERNAL_URI:http://127.0.0.1:8083}
    internal-token: ${INTERNAL_API_TOKEN:${INSURANCE_INTERNAL_TOKEN:}}
    timeout: ${CLINICAL_TIMEOUT:PT3S}
  # ---- DRG/DIP 模拟分组：读取病案首页手术操作 ----
  emr:
    base-url: ${EMR_INTERNAL_URI:http://127.0.0.1:8086}
    internal-token: ${INTERNAL_API_TOKEN:${INSURANCE_INTERNAL_TOKEN:}}
    timeout: ${EMR_TIMEOUT:PT3S}
  # ---- 医保实时结算接口骨架（G22）：地址与密钥由部署注入，域名必须命中白名单 ----
  realtime:
    base-url: ${INSURANCE_REALTIME_BASE_URL:}
    secret: ${INSURANCE_REALTIME_SECRET:}
    allowed-hosts: ${INSURANCE_REALTIME_ALLOWED_HOSTS:}
    timeout-ms: ${INSURANCE_REALTIME_TIMEOUT_MS:3000}
  # ---- 国家医保信息平台 2.0（CHS）报文适配（第 261 批）----
  # 默认关闭：关闭时沿用上面 realtime 的私有报文，升级不改既有行为。
  # 开启后：信封字段按国家规范固定；交易号/路径/input 模板按统筹区配置。
  chs:
    enabled: ${CHS_ENABLED:false}
    base-url: ${CHS_BASE_URL:}
    # 未单独配置时沿用 realtime.allowed-hosts（fail-closed，空集拒绝）
    allowed-hosts: ${CHS_ALLOWED_HOSTS:}
    timeout: ${CHS_TIMEOUT:PT10S}
    fixmedins-code: ${CHS_FIXMEDINS_CODE:}
    fixmedins-name: ${CHS_FIXMEDINS_NAME:}
    recer-sys-code: ${CHS_RECER_SYS_CODE:HIS}
    mdtrtarea-admvs: ${CHS_MDTRTAREA_ADMVS:}
    insuplc-admdvs: ${CHS_INSUPLC_ADMDVS:}
    inf-ver: ${CHS_INF_VER:V1.0}
    # HMAC_SHA256 / MD5 / NONE（NONE = 由前置机或 CA 签名）
    sign-type: ${CHS_SIGN_TYPE:HMAC_SHA256}
    secret: ${CHS_SECRET:}
    opter: ${CHS_OPTER:medassist}
    opter-name: ${CHS_OPTER_NAME:MedAssist}
    ret-code-field: ${CHS_RET_CODE_FIELD:ret_code}
    ret-msg-field: ${CHS_RET_MSG_FIELD:ret_msg}
    settlement-id-path: ${CHS_SETTLEMENT_ID_PATH:output.setl_id}
    success-codes: ${CHS_SUCCESS_CODES:0}
    # 交易号仅为国家口径常用值示例，上线前必须按统筹区规范核对/覆盖。
    # template 留空使用内置模板（{{field}} 占位符），可按地区覆盖 input 字段。
    transactions:
      PRE_SETTLE:
        infno: ${CHS_INFNO_PRE_SETTLE:2202}
        path: ${CHS_PATH_PRE_SETTLE:}
      SETTLE:
        infno: ${CHS_INFNO_SETTLE:2201}
        path: ${CHS_PATH_SETTLE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
