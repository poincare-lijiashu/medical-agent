server:
  # 网关会把完整权限点列表注入 X-Permissions，管理员令牌可超过 Tomcat 默认 8KB 头上限
  max-http-request-header-size: 32KB
  port: 8086
  shutdown: graceful

spring:
  application:
    name: platform-emr

  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: emr-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  flyway:
    enabled: true
    schemas: emr_svc
    default-schema: emr_svc
    locations: classpath:db/migration/emr
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

# ---- 服务间调用：emr → empi（内网直连，不经网关）----
emr:
  empi:
    base-url: ${EMPI_INTERNAL_URI:http://127.0.0.1:8082}
    internal-token: ${INTERNAL_API_TOKEN:${EMR_INTERNAL_TOKEN:}}
    timeout: ${EMPI_TIMEOUT:PT2S}
  # ---- 服务间调用：emr → clinical（读取入院时间，用于书写时限质控）----
  clinical:
    base-url: ${CLINICAL_INTERNAL_URI:http://127.0.0.1:8083}
    internal-token: ${INTERNAL_API_TOKEN:${EMR_INTERNAL_TOKEN:}}
    timeout: ${CLINICAL_TIMEOUT:PT2S}
  # ---- 供下游读取首页手术操作（医保 DRG 模拟分组）的内部接口令牌 ----
  internal:
    token: ${INTERNAL_API_TOKEN:${EMR_INTERNAL_TOKEN:}}
  # ---- CA 电子签名适配层：mock 本地 HMAC；vendor 调用厂商 HTTP ----
  ca:
    mode: ${CA_MODE:mock}
    base-url: ${CA_BASE_URL:http://127.0.0.1:9098}
    api-key: ${CA_API_KEY:}
    secret: ${CA_SECRET:medassist-dev-ca-secret}
    timeout: ${CA_TIMEOUT:PT2S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
