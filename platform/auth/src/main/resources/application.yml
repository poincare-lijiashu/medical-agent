server:
  port: 8081

spring:
  application:
    name: platform-auth
  cloud:
    nacos:
      discovery:
        # P0-1 骨架阶段：默认关闭注册；本地底座（docker compose up -d nacos）就绪后
        # 置 NACOS_DISCOVERY_ENABLED=true 即注册。
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.medassist: DEBUG
