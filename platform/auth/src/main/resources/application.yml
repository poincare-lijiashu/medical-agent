server:
  port: 8081

spring:
  application:
    name: platform-auth

  # ---- 数据源（服务自治 schema auth_svc；凭据经环境变量注入，默认值仅本地开发）----
  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  # ---- 版本化迁移（Flyway）：只管理 auth_svc schema，绝不触碰其他域 ----
  flyway:
    enabled: true
    schemas: auth_svc
    default-schema: auth_svc
    locations: classpath:db/migration/auth
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

# ---- JWT 签发（auth 是唯一签发方；网关用同一密钥校验）----
# 生产必须注入 JWT_SECRET（≥32 字节，由密钥管理下发）；默认值仅本地联调，启动日志会告警。
medassist:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:medassist-auth}
      secret: ${JWT_SECRET:<dev-jwt-secret>}
      ttl: ${JWT_TTL:PT8H}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      # K8s 探针：liveness 用 livenessState，readiness 必须带上 db——
      # 数据库不可用时 Pod 不应继续接收流量（否则登录/账号查询全部 500）
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: DEBUG
