server:
  port: 8081

spring:
  application:
    name: platform-auth

  # ---- 数据源（服务自治 schema auth_svc；凭据经环境变量注入，默认值仅本地开发）----
  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  # ---- 版本化迁移（Flyway）：只管理 auth_svc schema，绝不触碰其他域 ----
  flyway:
    enabled: true
    schemas: auth_svc
    default-schema: auth_svc
    locations: classpath:db/migration/auth
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.medassist: DEBUG
