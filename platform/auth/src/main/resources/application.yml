server:
  # 网关会把完整权限点列表注入 X-Permissions，管理员令牌可超过 Tomcat 默认 8KB 头上限
  max-http-request-header-size: 32KB
  port: 8081
  # 优雅停机（S10）：在途请求处理完再退出，滚动/灰度期不产生 5xx
  shutdown: graceful

spring:
  application:
    name: platform-auth

  # ---- 数据源（服务自治 schema auth_svc；凭据经环境变量注入，默认值仅本地开发）----
  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  # ---- 版本化迁移（Flyway）：只管理 auth_svc schema，绝不触碰其他域 ----
  flyway:
    enabled: true
    schemas: auth_svc
    default-schema: auth_svc
    locations: classpath:db/migration/auth
    # 生产应设为 false：baseline-on-migrate 会把"已有手工 schema 但无版本记录"的情况
    # 静默标记为已迁移，从而掩盖真实的 schema 漂移（S9）
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

# ---- JWT 签发（auth 是唯一签发方；网关用同一密钥校验）----
# 生产必须注入 JWT_SECRET（≥32 字节，由密钥管理下发）；默认值仅本地联调，启动日志会告警。
# P1：访问令牌默认 30 分钟 + 轮换式刷新令牌 7 天（登出/停用走撤销名单，网关 15s 内生效）
medassist:
  auth:
    # 内部接口令牌（/internal/**）：与全平台 INTERNAL_API_TOKEN 同源，未配置时内部接口
    # 一律拒绝（fail-closed）——避免"忘了配"让撤销名单与 token 校验接口裸奔。
    internal-token: ${INTERNAL_API_TOKEN:${AUTH_INTERNAL_TOKEN:}}
    jwt:
      issuer: ${JWT_ISSUER:medassist-auth}
      secret: ${JWT_SECRET:<dev-jwt-secret>}
      ttl: ${JWT_TTL:PT30M}
      refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    login-throttle:
      enabled: ${LOGIN_THROTTLE_ENABLED:true}
      max-failures: ${LOGIN_THROTTLE_MAX_FAILURES:5}
      # IP 维度阈值必须远高于账号维度（医院内网共享 NAT 出口，低阈值会连坐整层楼）
      max-ip-failures: ${LOGIN_THROTTLE_MAX_IP_FAILURES:30}
      window: ${LOGIN_THROTTLE_WINDOW:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      # K8s 探针：liveness 用 livenessState，readiness 必须带上 db——
      # 数据库不可用时 Pod 不应继续接收流量（否则登录/账号查询全部 500）
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
