server:
  port: 8080
  # 请求头上限（与各业务服务的 32KB 对齐）。管理员令牌携带权限点快照约 7.6KB，
  # 再加浏览器标准请求头（UA / sec-ch-ua / cookie 等）会越过 Netty 默认 8KB，
  # 表现为整站 431 —— 命令行复现不了，只在真实浏览器出现（2026-11-12 实测）。
  max-http-request-header-size: ${GATEWAY_MAX_HEADER_SIZE:32KB}
  # 优雅停机（S10）：SIGTERM 后先摘流再停，避免滚动/灰度期间把在途请求切断成 5xx
  shutdown: graceful

spring:
  application:
    name: medassist-gateway
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
    sentinel:
      filter:
        # 关闭 SCA 的 WebFlux URL 维度过滤器：网关限流统一走路由维度的
        # SentinelGatewayFilter（SentinelGatewayConfig）。两者同时开启会双重拦截，
        # 且 WebFlux 过滤器抛出的 FlowException 无人处理会变成 500（2026-10-30 实测）
        enabled: false
    # 双轨路由（计划书 D9.2 迁移第 1 步：接口兼容层）：
    #   v1 → 现行 Python 服务（AI 中台 + 既有 61 端点），路径原样透传，老代码零改动
    #   v2 → Java 微服务，路径形如 /api/v2/{service}/...；StripPrefix=3 去掉
    #        api / v2 / {service} 三段，服务内只保留业务路径（如 /internal/health）
    gateway:
      server:
        webflux:
          # ---- 下游 HTTP 客户端（504 防线）----
          # 1) 全局兜底：任何路由漏配 metadata 时也不至于无限等待。
          # 2) 连接池必须显式配置：SCG 默认 ELASTIC 池上限约 max(cpu,8)*2（≈16 条），
          #    且 acquire-timeout 默认 45s——比 30s 的 response-timeout 还长。
          #    结果是一个慢下游占满连接后，后续请求排队 45s，整条路由族集体 504。
          #    这里把 acquire-timeout 压到 2s，让"拿不到连接"快速 503，而不是排队到 504。
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            pool:
              type: fixed
              max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:256}
              acquire-timeout: ${GATEWAY_POOL_ACQUIRE_TIMEOUT_MS:2000}
              max-idle-time: 30s
              max-life-time: 5m
          routes:
            - id: ai-core-v1
              uri: ${AI_CORE_URI:http://127.0.0.1:8001}
              predicates:
                - Path=/api/v1/**
              # v1 兼容层此前没有任何超时元数据，慢下游会一直占着网关连接。
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            - id: platform-auth-v2
              uri: ${PLATFORM_AUTH_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v2/auth/**
              filters:
                - StripPrefix=3
              # 下游超时（毫秒）：没有超时时慢下游会一直占着网关连接，
              # 直到连接池耗尽，表现为"整站卡死"而不是单个接口变慢。
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            - id: platform-empi-v2
              uri: ${PLATFORM_EMPI_URI:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v2/empi/**
              filters:
                - StripPrefix=3
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 临床核心（挂号/就诊/医嘱/收费）
            # 注意：clinical 服务的控制器自带 /clinical 前缀（BillingController 等），
            # 因此这里只剥掉 /api/v2，剥 3 段会变成 /wards 导致全量 404。
            - id: platform-clinical-v2
              uri: ${PLATFORM_CLINICAL_URI:http://127.0.0.1:8083}
              predicates:
                - Path=/api/v2/clinical/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 药房（药品字典/库存/处方/发药）
            - id: platform-pharmacy-v2
              uri: ${PLATFORM_PHARMACY_URI:http://127.0.0.1:8084}
              predicates:
                - Path=/api/v2/pharmacy/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 物资耗材（目录/批次库存/出库/高值追溯与召回）
            - id: platform-material-v2
              uri: ${PLATFORM_MATERIAL_URI:http://127.0.0.1:8089}
              predicates:
                - Path=/api/v2/material/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 医技（检查/检验申请、标本、报告、危急值）
            - id: platform-tech-v2
              uri: ${PLATFORM_TECH_URI:http://127.0.0.1:8085}
              predicates:
                - Path=/api/v2/tech/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 病历（模板/书写/签名/归档/质控）
            - id: platform-emr-v2
              uri: ${PLATFORM_EMR_URI:http://127.0.0.1:8086}
              predicates:
                - Path=/api/v2/emr/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 医保（目录/映射/参保/结算清单）
            - id: platform-insurance-v2
              uri: ${PLATFORM_INSURANCE_URI:http://127.0.0.1:8087}
              predicates:
                - Path=/api/v2/insurance/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 知识库（知识空间/文档/切片/企业检索）
            - id: platform-kb-v2
              uri: ${PLATFORM_KB_URI:http://127.0.0.1:8088}
              predicates:
                - Path=/api/v2/kb/**
              filters:
                - StripPrefix=2
              # 知识库问答比普通 CRUD 慢（解析/检索/引用拼装），单独放宽到 60s
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_KB_RESPONSE_TIMEOUT_MS:60000}
            # FHIR R4 开放层（Patient/Encounter/Observation/MedicationRequest，只读）
            # 注意：**不剥前缀**。FHIR 的 Bundle.fullUrl/self 是对端回查地址，
            # 路径一旦在网关被改写，返回的链接就指向不存在的路径；
            # 服务端同时映射 /fhir/**（直连）与 /api/v2/fhir/**（经网关）。
            - id: platform-fhir-v2
              uri: ${PLATFORM_FHIR_URI:http://127.0.0.1:8090}
              predicates:
                - Path=/api/v2/fhir/**
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            # 主数据与字典映射治理（域/条目/版本链/外部编码映射/变更审批/导入）
            # 控制器自带 /mdm 前缀，因此剥 2 段：/api/v2/mdm/domains → /mdm/domains
            - id: platform-masterdata-v2
              uri: ${PLATFORM_MASTERDATA_URI:http://127.0.0.1:8091}
              predicates:
                - Path=/api/v2/mdm/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                # 导入预检/应用可能处理数千行，单次请求放宽到 60s（与知识库同级）
                response-timeout: ${GATEWAY_MDM_RESPONSE_TIMEOUT_MS:60000}
            # 历史数据迁移（目标/模板/映射档案/预检/应用/回滚/对账）
            # 控制器自带 /migration 前缀，因此剥 2 段：/api/v2/migration/targets → /migration/targets
            - id: platform-migration-v2
              uri: ${PLATFORM_MIGRATION_URI:http://127.0.0.1:8092}
              predicates:
                - Path=/api/v2/migration/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                # 批量预检 5000 行、应用/回滚均在单次请求内完成，单独放宽到 120s
                response-timeout: ${GATEWAY_MIGRATION_RESPONSE_TIMEOUT_MS:120000}
            # 运营支撑（服务目录/SLA/工单/看板）：控制器自带 /ops 前缀，剥 2 段
            - id: platform-ops-v2
              uri: ${PLATFORM_OPS_URI:http://127.0.0.1:8093}
              predicates:
                - Path=/api/v2/ops/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_OPS_RESPONSE_TIMEOUT_MS:30000}
            # 版本与补丁机制（组件版本/发布列车/兼容矩阵/补丁/冻结/部署回滚）：控制器自带 /release 前缀
            - id: platform-release-v2
              uri: ${PLATFORM_RELEASE_URI:http://127.0.0.1:8094}
              predicates:
                - Path=/api/v2/release/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RELEASE_RESPONSE_TIMEOUT_MS:30000}
            # 授权与许可（版本矩阵/授权书验签/模块权益/配额）：控制器自带 /license 前缀
            - id: platform-license-v2
              uri: ${PLATFORM_LICENSE_URI:http://127.0.0.1:8095}
              predicates:
                - Path=/api/v2/license/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_LICENSE_RESPONSE_TIMEOUT_MS:15000}
            # 审计汇聚（跨 auth/empi 的 change_log 统一查询）：由 auth 服务的 AuditController 提供，
            # 路径 /api/v2/audit/events → /events；权限点 audit:log:read 在 auth 内校验
            - id: platform-audit-v2
              uri: ${PLATFORM_AUTH_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v2/audit/**
              filters:
                - StripPrefix=3
              metadata:
                connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
                response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        # 刻意不暴露 gateway 端点：/actuator/gateway 会返回全部路由与下游内网地址，
        # 是未认证即可读到的内部拓扑（M2）。metrics/info 也一并收敛。
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# ---- 统一鉴权（P0-4）----
# 受保护前缀内必须携带有效 Bearer JWT；失败统一 401 壳。
# 白名单只放行登录与健康检查；/api/v2/*/internal/** 直接 404，内部端点不经网关外泄。
# v1 兼容层（/api/v1/**）自 2026-11 起默认并入受保护前缀（P1-S6），
# 仅在迁移期需要"Python 自证"时用 GATEWAY_V1_PROTECTED= 显式退出。
medassist:
  gateway:
    auth:
      enabled: ${GATEWAY_AUTH_ENABLED:true}
      issuer: ${JWT_ISSUER:medassist-auth}
      secret: ${JWT_SECRET:<dev-jwt-secret>}
      # auth 内网地址：仅用于撤销名单增量同步（不参与请求转发；转发地址见路由配置）
      auth-uri: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}
      # auth 的 /internal/** 已 fail-closed 校验，同步撤销名单必须带同一令牌
      internal-token: ${INTERNAL_API_TOKEN:${GATEWAY_INTERNAL_TOKEN:}}
      revocation-sync:
        enabled: ${REVOCATION_SYNC_ENABLED:true}
        interval: ${REVOCATION_SYNC_INTERVAL:PT15S}
        # 启动时首次拉取失败即拒绝启动，避免"重启后撤销名单为空"把已登出令牌放行（M4）
        fail-fast-on-startup: ${REVOCATION_FAIL_FAST:true}
      # 真实客户端 IP：只有来自这些网段的请求才允许用 X-Forwarded-For 推断来源。
      # 为空（默认）= 完全不信任 XFF，直接取 TCP 对端地址（安全默认）。
      # 集群内建议填 Ingress/NAT 网段，如 10.0.0.0/8,192.168.0.0/16
      client-ip:
        trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
      whitelist:
        - /api/v2/auth/login
        - /api/v2/auth/refresh
        # 统一身份 SSO（G42）：登录前调用，必须免令牌；安全由一次性 state + PKCE + nonce 保证。
        - /api/v2/auth/sso/config
        - /api/v2/auth/sso/oidc/authorize
        - /api/v2/auth/sso/oidc/callback
        # 开放平台客户端换令牌（OAuth2 client_credentials）：第三方没有用户令牌，
        # 安全由 client_id + 一次性密钥（只存哈希）+ 只读 scope 目录保证。
        - /api/v2/auth/oauth/token
        # 外部系统入站（告警平台/CI）：网关不验用户令牌，服务端按接入源令牌校验并固定 actor。
        # 仅这两个前缀放行，管理接入源的 /api/v2/ops/integrations/** 仍需 JWT。
        - /api/v2/ops/hooks/**
        - /api/v2/release/hooks/**
        # K8s 探针路径为 /actuator/health/liveness|readiness，必须放行，否则探针会拿到 401；
        # 但**不再放行 /actuator/** 整段**（那会把路由表、指标、bean 信息一并裸奔），
        # 只精确白名单健康检查与 Prometheus 抓取（后者由 NetworkPolicy 限制来源）。
        - /actuator/health/**
        - /actuator/prometheus
      protected-paths:
        - /api/v2/**
        # P1-S6：v1 兼容层默认同样必须过网关鉴权（此前只靠 Python 自行鉴权，
        # 忘配就是整段裸奔）。确需保留"Python 自证"的过渡态时，
        # 显式设置 GATEWAY_V1_PROTECTED=（空串）把它从受保护前缀中移除。
        - ${GATEWAY_V1_PROTECTED:/api/v1/**}
      deny-paths:
        # 服务间内部接口：网关任何情况下都不转发（P0-4 起为 /api/v2/*/internal/**）。
        # 第 173 批补全：/internal/** 也显式拒绝——当前网关没有该前缀的路由，
        # 但一旦有人新增 catch-all 路由，旧规则不会拦截，这条是"最后一道门"。
        - /internal/**
        - /api/v2/*/internal/**
        # 第 175 批：入口面收敛——API 文档不进生产入口（网关直接 404）。
        # 生产类 APP_ENV 下 FastAPI 本就不开 /docs；这里补第二道门，防"环境变量误配成
        # development"时接口结构从公网裸奔（入口 404 与 env 无关）。
        - /docs/**
        - /redoc/**
        - /openapi.json
    # ---- 租户入口路由（§281 / ADR-001 全院级全栈隔离）----
    # enabled=false（本地联调/单院私有化）：不要求 Host 映射与令牌租户声明，
    #   一律注入 X-Tenant=${TENANT_DEFAULT_CODE}。
    # enabled=true（多院控制面）：Host 必须命中 hosts 映射，令牌 tenant 必须与之一致，
    #   instance 必须等于本 Cell 实例码；任一不符直接 403。
    #   hosts 用 `环境变量 + 逗号分隔` 表达，避免 YAML 里写死域名：
    #   TENANT_HOSTS="hospital-a.example=tenant-001,*.b.example=tenant-002"
    tenant:
      enabled: ${TENANT_ROUTING_ENABLED:false}
      default-tenant: ${TENANT_DEFAULT_CODE:tenant-001}
      instance-code: ${TENANT_INSTANCE_CODE:}
      hosts: ${TENANT_HOSTS:}
    # 安全响应头（§267，等保三级）：对所有响应统一注入，HSTS 只在 HTTPS 时输出。
    # 生产保持 enabled=true；任何关闭动作都必须有院方书面审批。
    security-headers:
      enabled: ${SECURITY_HEADERS_ENABLED:true}
      hsts-enabled: ${SECURITY_HSTS_ENABLED:true}
      hsts-max-age-seconds: ${SECURITY_HSTS_MAX_AGE:31536000}
      hsts-include-subdomains: ${SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
      trust-forwarded-proto: ${SECURITY_TRUST_FORWARDED_PROTO:true}
      no-store-for-auth-paths: ${SECURITY_NO_STORE_AUTH:true}
    # 入口限流（Sentinel 核心 API，路径前缀维度）。登录失败的账号维度限速在 auth 服务内实现。
    # 必须用列表：Map 键中的 "/" 会被 Spring 宽松绑定吞掉（实测 /api/v2/auth → apiv2auth）
    sentinel:
      enabled: ${SENTINEL_GATEWAY_ENABLED:true}
      flow-rules:
        - path: /api/v1
          qps: ${SENTINEL_QPS_AI_CORE:500}
        # 令牌端点单独限流：第三方换令牌是机器行为，不能与登录/刷新共用 200 QPS 的桶。
        # 列表按顺序前缀匹配，必须排在通用 /api/v2/auth 之前。
        - path: /api/v2/auth/oauth
          qps: ${SENTINEL_QPS_OAUTH:30}
        - path: /api/v2/auth
          qps: ${SENTINEL_QPS_AUTH:200}
        - path: /api/v2/empi
          qps: ${SENTINEL_QPS_EMPI:200}
        # HIS 工作台 → AI 的反向调用通道（第 173 批）：经网关 JWT 鉴权后由 clinical 转发，
        # 不占用临床高频桶；必须排在 /api/v2/clinical 之前（前缀匹配按列表顺序命中）。
        - path: /api/v2/clinical/ai-assist
          qps: ${SENTINEL_QPS_AI_ASSIST:20}
        # 重型查询单独限流：费用看板/欠费预警按在院患者逐条聚合（N+1），
        # 护理站轮询会吃满 /api/v2/clinical 的共享桶，殃及挂号收费。
        # 匹配是"列表顺序 + startsWith"，因此必须放在 /api/v2/clinical 之前。
        - path: /api/v2/clinical/inpatient/alerts
          qps: ${SENTINEL_QPS_CLINICAL_ALERTS:5}
        - path: /api/v2/clinical/inpatient
          qps: ${SENTINEL_QPS_CLINICAL_INPATIENT:60}
        - path: /api/v2/clinical
          qps: ${SENTINEL_QPS_CLINICAL:200}
        - path: /api/v2/pharmacy
          qps: ${SENTINEL_QPS_PHARMACY:150}
        - path: /api/v2/tech
          qps: ${SENTINEL_QPS_TECH:150}
        - path: /api/v2/emr
          qps: ${SENTINEL_QPS_EMR:150}
        - path: /api/v2/insurance
          qps: ${SENTINEL_QPS_INSURANCE:100}
        - path: /api/v2/kb
          qps: ${SENTINEL_QPS_KB:60}
        # 主数据以查询与批量导入为主：低频但单次较重，独立限流避免挤占临床桶
        - path: /api/v2/mdm
          qps: ${SENTINEL_QPS_MDM:60}
        - path: /api/v2/audit
          qps: ${SENTINEL_QPS_AUDIT:100}
        # 外部入站（告警/CI）：无用户令牌，必须单独限流，防止接入方故障时打满进程。
        # 列表按顺序前缀匹配，需放在通用 ops/release 之前。
        - path: /api/v2/ops/hooks
          qps: ${SENTINEL_QPS_OPS_HOOKS:30}
        - path: /api/v2/release/hooks
          qps: ${SENTINEL_QPS_RELEASE_HOOKS:30}
        - path: /api/v2/ops
          qps: ${SENTINEL_QPS_OPS:100}
        - path: /api/v2/release
          qps: ${SENTINEL_QPS_RELEASE:100}
        # 授权查询会被前端各页轮询（状态/权益），单独限流避免与业务桶互相影响；
        # 导入/签发是低频管理动作，同样落在这个桶里足够。
        - path: /api/v2/license
          qps: ${SENTINEL_QPS_LICENSE:60}
      # 熔断规则（慢调用比例）：慢下游不要靠排队硬扛，直接快速失败并给下游恢复窗口。
      # slow-rt-ms 必须明显小于网关 response-timeout（30s），否则永远等不到熔断就 504 了。
      degrade-rules:
        - path: /api/v2/clinical
          slow-rt-ms: ${SENTINEL_DEGRADE_CLINICAL_RT_MS:8000}
          slow-ratio: 0.5
          min-request-amount: 10
          stat-interval-ms: 10000
          time-window-sec: 15
        - path: /api/v2/clinical/inpatient
          slow-rt-ms: ${SENTINEL_DEGRADE_INPATIENT_RT_MS:6000}
          slow-ratio: 0.5
          min-request-amount: 5
          stat-interval-ms: 10000
          time-window-sec: 15
        - path: /api/v2/empi
          slow-rt-ms: ${SENTINEL_DEGRADE_EMPI_RT_MS:5000}
          slow-ratio: 0.5
          min-request-amount: 10
          stat-interval-ms: 10000
          time-window-sec: 10
        # 知识库问答本身慢（解析/检索/引用拼装），阈值放宽，但仍有上限
        - path: /api/v2/kb
          slow-rt-ms: ${SENTINEL_DEGRADE_KB_RT_MS:15000}
          slow-ratio: 0.6
          min-request-amount: 5
          stat-interval-ms: 10000
          time-window-sec: 20
        # 主数据导入/同步是长事务，阈值放宽但仍设上限，防止连接池被单次导入拖死
        - path: /api/v2/mdm
          slow-rt-ms: ${SENTINEL_DEGRADE_MDM_RT_MS:20000}
          slow-ratio: 0.6
          min-request-amount: 5
          stat-interval-ms: 10000
          time-window-sec: 20
        - path: /api/v1
          slow-rt-ms: ${SENTINEL_DEGRADE_V1_RT_MS:10000}
          slow-ratio: 0.5
          min-request-amount: 10
          stat-interval-ms: 10000
          time-window-sec: 15

logging:
  level:
    root: INFO
    com.medassist: INFO
