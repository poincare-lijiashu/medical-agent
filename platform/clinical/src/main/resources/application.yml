server:
  port: 8083
  # 优雅停机：在途收费/挂号请求处理完再退出
  shutdown: graceful

spring:
  application:
    name: platform-clinical

  datasource:
    # socketTimeout=30s / statementTimeout=25s：让数据库先超时并释放连接，
    # 而不是让请求在网关 30s 的 response-timeout 上变成 504。
    # statementTimeout 略小于 socketTimeout，保证服务端先中断慢查询。
    url: "jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}?socketTimeout=30&connectTimeout=5&tcpKeepAlive=true"
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: clinical-pool
      # 10 → 24：排台页按房间并发取数，池太小会把等待时间算进接口耗时
      maximum-pool-size: ${CLINICAL_POOL_MAX:24}
      minimum-idle: 4
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 1800000
      connection-init-sql: SET statement_timeout = 25000

  flyway:
    enabled: true
    schemas: clinical_svc
    default-schema: clinical_svc
    locations: classpath:db/migration/clinical
    # 生产设为 false（与 auth/empi 一致：schema 漂移必须让迁移失败而不是被掩盖）
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

# ---- 服务间调用：clinical → empi（内网直连，不经网关）----
# CLINICAL_INTERNAL_TOKEN 必须与 EMPI 的 INTERNAL_API_TOKEN 一致；未配置时服务拒绝启动
clinical:
  empi:
    base-url: ${EMPI_INTERNAL_URI:http://127.0.0.1:8082}
    internal-token: ${INTERNAL_API_TOKEN:${CLINICAL_INTERNAL_TOKEN:}}
    timeout: ${EMPI_TIMEOUT:PT2S}
  # 医嘱转处方：药房内网直连（不经网关），失败只把医嘱标记为可重试
  pharmacy:
    base-url: ${PHARMACY_INTERNAL_URI:http://127.0.0.1:8084}
    internal-token: ${INTERNAL_API_TOKEN:${CLINICAL_INTERNAL_TOKEN:}}
    timeout: ${PHARMACY_TIMEOUT:PT3S}
  # 检查/检验医嘱转申请：医技内网直连（不经网关），失败只把医嘱标记为可重试
  tech:
    base-url: ${TECH_INTERNAL_URI:http://127.0.0.1:8085}
    internal-token: ${INTERNAL_API_TOKEN:${CLINICAL_INTERNAL_TOKEN:}}
    timeout: ${TECH_TIMEOUT:PT3S}
  # 入站内部接口令牌（病历域读取入院时间、医保域拉取收费明细）；与出站共用同一令牌
  internal-api-token: ${INTERNAL_API_TOKEN:${CLINICAL_INTERNAL_TOKEN:}}

# ---- 报表订阅投递（G19–G23）----
medassist:
  report-delivery:
    # 出站 WEBHOOK / IM 域名白名单（逗号分隔），未配置时禁止创建此类订阅
    allowed-hosts: ${REPORT_DELIVERY_ALLOWED_HOSTS:}
    timeout-ms: ${REPORT_DELIVERY_TIMEOUT_MS:3000}
  # EMAIL 渠道：host 与 from 均非空才视为可用，否则创建订阅会被拒绝
  report-email:
    host: ${REPORT_EMAIL_HOST:}
    port: ${REPORT_EMAIL_PORT:25}
    username: ${REPORT_EMAIL_USERNAME:}
    password: ${REPORT_EMAIL_PASSWORD:}
    from: ${REPORT_EMAIL_FROM:}
    starttls: ${REPORT_EMAIL_STARTTLS:false}
    ssl: ${REPORT_EMAIL_SSL:false}
    timeout-ms: ${REPORT_EMAIL_TIMEOUT_MS:5000}
  # 电子票据厂商报文（G21/G24）：开具与红冲共用同一平台与密钥
  receipt-push:
    base-url: ${RECEIPT_PUSH_BASE_URL:}
    secret: ${RECEIPT_PUSH_SECRET:}
    allowed-hosts: ${RECEIPT_PUSH_ALLOWED_HOSTS:}
    timeout-ms: ${RECEIPT_PUSH_TIMEOUT_MS:3000}
    vendor: ${RECEIPT_PUSH_VENDOR:FINANCE}
    template-version: ${RECEIPT_PUSH_TEMPLATE_VERSION:1.0}
    hospital-code: ${RECEIPT_PUSH_HOSPITAL_CODE:}
  # 出院带药发药结果同步（G30）：每 5 分钟向药房查询已提交单据
  discharge-med:
    sync-enabled: ${DISCHARGE_MED_SYNC_ENABLED:true}
    sync-cron: ${DISCHARGE_MED_SYNC_CRON:0 */5 * * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
