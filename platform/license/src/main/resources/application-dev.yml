# ============================================================================
# 本地开发专用覆盖（严禁用于 staging/prod）
#
# 用法：java -jar platform-license.jar --spring.profiles.active=dev
# ============================================================================

medassist:
  license:
    # 开发环境按厂商构建运行，允许签发样本授权书，方便演示"导入 → 验签 → 生效"全链路
    deployment-mode: vendor
    issuance-enabled: true

logging:
  level:
    com.medassist: DEBUG
