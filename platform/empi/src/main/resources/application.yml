server:
  port: 8082
  # 优雅停机（S10）：在途请求处理完再退出，滚动/灰度期不产生 5xx
  shutdown: graceful

spring:
  application:
    name: platform-empi

  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: empi-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  flyway:
    enabled: true
    schemas: empi_svc
    default-schema: empi_svc
    locations: classpath:db/migration/empi
    # 生产应设为 false（见 auth 同名说明）：避免掩盖 schema 漂移（S9）
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

# ---- 敏感字段加密（密钥必须由密钥管理系统注入，仓库内不得有可用的默认值）----
# EMPI_FIELD_KEY：Base64 编码的 32 字节密钥（AES-256），缺失则拒绝启动（FieldCipher fail-fast）
# EMPI_HASH_SALT：查重哈希盐（≥16 字符，与密钥分离保管），缺失则拒绝启动
# 本地开发用 `--spring.profiles.active=dev` 载入 application-dev.yml 的占位密钥；
# 生产走外部 Secret（Helm: external.empi.existingSecret / secretKeys）。
empi:
  field-key: ${EMPI_FIELD_KEY:}
  hash-salt: ${EMPI_HASH_SALT:}
  # 服务间内部接口令牌（clinical → empi 查询患者）；未配置时内部接口一律拒绝（fail-closed）
  internal-token: ${INTERNAL_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
