server:
  # 网关会把完整权限点列表注入 X-Permissions，管理员令牌可超过 Tomcat 默认 8KB 头上限
  max-http-request-header-size: 32KB
  port: 8090
  # 优雅停机：滚动/灰度期在途的 FHIR 查询处理完再退出
  shutdown: graceful

spring:
  application:
    name: platform-fhir

  datasource:
    # 业务域（clinical/tech/empi/pharmacy）只读；本服务只写 fhir_svc 下的
    # 访问审计与 XDS 注册表/文档内容。生产建议：业务域账号仅授 SELECT，
    # fhir_svc 账号可写；或把 FHIR 读取指向只读副本（见 platform/README.md「FHIR 开放层」）。
    url: "jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}?sslmode=${PG_SSLMODE:prefer}&sslrootcert=${PG_SSLROOTCERT:}"
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: fhir-pool
      maximum-pool-size: 6
      minimum-idle: 1
      connection-timeout: 5000
      max-lifetime: 1800000

  flyway:
    enabled: true
    schemas: fhir_svc
    default-schema: fhir_svc
    locations: classpath:db/migration/fhir
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

medassist:
  fhir:
    # 分页上限：FHIR 客户端可以请求更大的 _count，但服务端必须截断，
    # 否则一次查询可以把整院患者拉走（既打爆内存，也不符合最小必要原则）。
    default-page-size: ${FHIR_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${FHIR_MAX_PAGE_SIZE:100}
    # _offset 上限：防止深度翻页把数据库拖死；超出直接 400，而不是静默返回空。
    max-offset: ${FHIR_MAX_OFFSET:10000}
    # Bundle.fullUrl 前缀。留空则按当前请求推断（经网关时自动带上 /api/v2/fhir）。
    base-url: ${FHIR_BASE_URL:}
    # ---- IHE XDS 文档共享（§295）----
    # 单份文档上限（字节）：防一次注册把内存打爆；超过直接 422。
    xds-max-document-bytes: ${XDS_MAX_DOCUMENT_BYTES:5242880}
    # 院方在区域平台注册的 OID 根；默认值仅用于本地联调，上线必须替换。
    xds-root-oid: ${XDS_ROOT_OID:1.2.156.112.1.1}
    # CDA 保管机构名称（写入 custodian）。
    xds-custodian-name: ${XDS_CUSTODIAN_NAME:铭医医院信息平台}
    # WS 445 模板 OID：出院小结 / 检验报告。上线前由院方按属地规范核对。
    xds-discharge-template-id: ${XDS_DISCHARGE_TEMPLATE_ID:2.16.156.10011.2.1.1.31}
    xds-lab-template-id: ${XDS_LAB_TEMPLATE_ID:2.16.156.10011.2.1.1.28}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
