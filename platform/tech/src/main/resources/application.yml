server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: platform-tech

  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: tech-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  flyway:
    enabled: true
    schemas: tech_svc
    default-schema: tech_svc
    locations: classpath:db/migration/tech
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

# ---- 服务间调用：tech → empi（内网直连，不经网关）----
tech:
  empi:
    base-url: ${EMPI_INTERNAL_URI:http://127.0.0.1:8082}
    internal-token: ${INTERNAL_API_TOKEN:${TECH_INTERNAL_TOKEN:}}
    timeout: ${EMPI_TIMEOUT:PT2S}
  # 入站内部接口令牌（临床医嘱转检查/检验申请）；与出站共用同一令牌
  internal-api-token: ${INTERNAL_API_TOKEN:${TECH_INTERNAL_TOKEN:}}
  # 危急值超时提醒阈值（分钟）：超过该时长仍未确认，查询接口会标记 overdue
  critical-timeout-minutes: ${TECH_CRITICAL_TIMEOUT_MINUTES:30}
  # DICOMweb（PACS 调阅）：未配置 base-url 时阅片队列与本地元数据照常可用，影像流返回 503
  pacs:
    base-url: ${PACS_BASE_URL:}
    timeout: ${PACS_TIMEOUT:PT10S}
    auth-header: ${PACS_AUTH_HEADER:}
    max-instance-bytes: ${PACS_MAX_INSTANCE_BYTES:67108864}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
