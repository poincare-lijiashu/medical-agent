server:
  # 网关会把完整权限点列表注入 X-Permissions，管理员令牌可超过 Tomcat 默认 8KB 头上限
  max-http-request-header-size: 32KB
  port: 8085
  shutdown: graceful

spring:
  application:
    name: platform-tech

  datasource:
    # 评测 04 遗留：JDBC 连接 TLS。默认 prefer（有 TLS 就用、没有回落明文，本地联调不受影响）；
    # staging/prod 由 Helm 注入 PG_SSLMODE=verify-full，并按需注入 PG_SSLROOTCERT（CA 路径）。
    url: "jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_DATABASE:medagent}?sslmode=${PG_SSLMODE:prefer}&sslrootcert=${PG_SSLROOTCERT:}"
    username: ${PG_USER:medagent}
    password: ${PG_PASSWORD:medagent123}
    hikari:
      pool-name: tech-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  flyway:
    enabled: true
    schemas: tech_svc
    default-schema: tech_svc
    locations: classpath:db/migration/tech
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}

  # DIMSE C-STORE 上传的是单个 DICOM 文件，默认 1MB 不够（CT/MR 单实例常见 10–50MB）
  servlet:
    multipart:
      max-file-size: ${PACS_DIMSE_MAX_FILE_BYTES:67108864}
      max-request-size: ${PACS_DIMSE_MAX_REQUEST_BYTES:69206016}

# ---- 服务间调用：tech → empi（内网直连，不经网关）----
tech:
  empi:
    base-url: ${EMPI_INTERNAL_URI:http://127.0.0.1:8082}
    internal-token: ${INTERNAL_API_TOKEN:${TECH_INTERNAL_TOKEN:}}
    timeout: ${EMPI_TIMEOUT:PT2S}
  # 入站内部接口令牌（临床医嘱转检查/检验申请）；与出站共用同一令牌
  internal-api-token: ${INTERNAL_API_TOKEN:${TECH_INTERNAL_TOKEN:}}
  # 危急值超时提醒阈值（分钟）：超过该时长仍未确认，查询接口会标记 overdue
  critical-timeout-minutes: ${TECH_CRITICAL_TIMEOUT_MINUTES:30}
  # DICOMweb（PACS 调阅）：未配置 base-url 时阅片队列与本地元数据照常可用，影像流返回 503
  pacs:
    base-url: ${PACS_BASE_URL:}
    timeout: ${PACS_TIMEOUT:PT10S}
    auth-header: ${PACS_AUTH_HEADER:}
    max-instance-bytes: ${PACS_MAX_INSTANCE_BYTES:67108864}
    # OHIF 等查看器根地址（如 http://ohif.local/viewer）；为空时回退到 PACS 登记回传的 viewerUrl
    viewer-url: ${PACS_VIEWER_URL:}
    # DIMSE 网关：远端主机/被叫 AE/目的地白名单只能来自配置，不接受请求参数（防任意 DICOM 转发）
    dimse:
      enabled: ${PACS_DIMSE_ENABLED:false}
      host: ${PACS_DIMSE_HOST:127.0.0.1}
      port: ${PACS_DIMSE_PORT:4242}
      called-ae: ${PACS_DIMSE_CALLED_AE:MEDAGENT}
      calling-ae: ${PACS_DIMSE_CALLING_AE:MEDASSIST_HIS}
      connect-timeout: ${PACS_DIMSE_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${PACS_DIMSE_REQUEST_TIMEOUT:PT30S}
      max-file-bytes: ${PACS_DIMSE_MAX_FILE_BYTES:67108864}
      # 逗号分隔的允许目的地；为空表示拒绝所有 C-MOVE（fail-closed）
      move-destinations: ${PACS_DIMSE_MOVE_DESTINATIONS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.medassist: INFO
