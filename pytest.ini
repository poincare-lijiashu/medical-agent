[pytest]
; 对抗轮 A3：全局测试超时防线——单测悬挂（网络/锁/死循环）300s 兜底熔断。
; method=thread：超时走线程中断并dump栈，不杀整个 pytest 进程，便于定位与清理。
addopts = --timeout=300 --timeout_method=thread
; 第 70 批：红队/安全对抗用例标记（CI 先跑 `-m redteam` 作为独立阻断门禁）。
; 标记只用于门禁筛选，默认全量运行仍包含这些用例，不做排除。
markers =
    redteam: 红队对抗与安全用例（越权注入/PHI/令牌边界）；CI 以 `-m redteam` 阻断
