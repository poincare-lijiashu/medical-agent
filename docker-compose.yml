name: medagent

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: medagent_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - medagent_etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:latest  # 本地已有；镜像站 m.daocloud.io 拒绝拉取
    container_name: medagent_minio
    environment:
      # 终评 F6 收口：凭证 env 化（.env / .env.local 覆盖；生产必改，默认值仅供本地开发）
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # 终评 F6 收口：仅绑回环——S3 API/控制台不对局域网暴露（容器网内 milvus 仍走服务名访问）
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - medagent_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0  # 与既有数据卷 medagent_milvus-db 同版本
    container_name: medagent_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - medagent_milvus-db:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  postgres:
    image: postgres:15-alpine  # 本地已有
    container_name: medagent_pg
    environment:
      POSTGRES_USER: medagent
      # 终评 F6 收口：密码 env 化（.env / .env.local 设 POSTGRES_PASSWORD 覆盖；
      # 默认 medagent123 仅供本地开发——生产必改强口令）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medagent123}
      POSTGRES_DB: medagent
    ports:
      # 终评 F6 收口：仅绑回环（宿主 5433 → 容器 5432），不对局域网暴露
      - "127.0.0.1:5433:5432"
    volumes:
      - medagent_pg:/var/lib/postgresql/data

  # 轮 B2 可选 Redis（三级部署之二：院区级多实例才需要）——已按 DEPLOY.md「二级：院区级
  # 多实例」激活：服务随 compose 默认拉起（单机 REDIS_URL 留空时 app 仍走内存后端，
  # redis 容器闲置无害）。启用共享：`.env.local` 设 REDIS_URL=redis://127.0.0.1:6379/0
  # （宿主机形态）或 redis://redis:6379/0（容器形态），验证清单见 DEPLOY.md。
  redis:
    image: redis:7-alpine
    container_name: medagent_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - medagent_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  attu:
    image: zilliz/attu:v2.4.12  # 本地已有
    container_name: medagent_attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - milvus

  # ---- 平台底座（P0，计划书 D2.2）：服务注册与配置中心 ----
  # 说明：Nacos 为 Java 微服务（platform/*）的注册发现与配置来源；Python AI 中台经
  # nacos-sdk-python 同样注册（计划书 D6.1）。控制台 http://127.0.0.1:8848/nacos
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: medagent_nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # 鉴权：Nacos 2.4+ 出于安全不再自动创建默认管理员（实测客户端注册报
      # "ErrCode:403 user not found"），本地开发底座默认关闭以便联调；
      # 【生产必开】NACOS_AUTH_ENABLE=true，并先用控制台初始化管理员、改默认口令、
      # 改用外部 MySQL 持久化（derby 仅适合单机联调），详见 platform/README.md。
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-TWVkQXNzaXN0TmFjb3NMb2NhbERldlRva2VuMzJCeXRlcyE=}
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    volumes:
      - medagent_nacos:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  app:
    build: .
    profiles: ["full"]  # 默认不启动：后端通常在宿主机直接跑 uvicorn，容器化需 docker compose --profile full up
    container_name: medagent_app
    env_file: .env.local
    environment:
      - MILVUS_URI=http://milvus:19530
      - PG_HOST=postgres
      - PG_PORT=5432
    ports:
      - "8001:8001"
    volumes:
      - ./backend/models:/app/backend/models
      - medagent_data:/app/data
    depends_on:
      - milvus
      - postgres

volumes:
  medagent_etcd:
  medagent_minio:
  medagent_milvus-db:
  medagent_pg:
  medagent_data:
  medagent_redis:
  medagent_nacos:
