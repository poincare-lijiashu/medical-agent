apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medassist-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: medassist-platform
    medassist.io/env: staging
spec:
  project: medassist
  source:
    repoURL: https://git.hospital.local/medassist/medical_agent.git
    # 预发布跟随 release 分支，生产跟随 tag（见 platform-prod.yaml）
    targetRevision: release
    path: deploy/helm/medassist-platform
    helm:
      releaseName: medassist
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medassist-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
