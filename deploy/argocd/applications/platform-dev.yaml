apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medassist-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: medassist-platform
    medassist.io/env: dev
spec:
  project: medassist
  source:
    repoURL: https://git.hospital.local/medassist/medical_agent.git
    targetRevision: main
    path: deploy/helm/medassist-platform
    helm:
      releaseName: medassist
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medassist-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  # HPA 管理的副本数不应被 Git 中的值拉回
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
