# ============================================================================
# SkyWalking 可观测底座（本地/院区级自建形态）
#
# 用途：为 Java 微服务（gateway/auth/empi）与 Python AI 中台提供统一 APM：
#   - OAP 11800（gRPC，agent 上报）/ 12800（HTTP，UI 与 GraphQL 查询）
#   - UI  8088
#   - 存储：PostgreSQL（复用团队熟悉的运维体系；生产建议独立实例 + 定期归档）
#
# 用法：
#   docker compose -f deploy/observability/docker-compose.observability.yml up -d
#
# 说明：
#   - 与主 compose 同为 project=medagent，但独立文件管理，避免业务发布牵动观测底座；
#   - 镜像可用 SW_OAP_IMAGE / SW_UI_IMAGE 指向院内镜像仓库（外网受限环境）：
#       $env:SW_OAP_IMAGE="harbor.hospital.local/apache/skywalking-oap-server:11.0.0"
#   - OAP 11.0.0 / UI 11.0.0 为 2026-08 发布的当前稳定版；Java agent 9.8.0 由
#     Helm chart 的 initContainer 注入，Python agent 1.3.0 由容器 entrypoint 注入。
# ============================================================================
name: medagent

services:
  skywalking-postgres:
    image: postgres:15-alpine
    container_name: medagent_skywalking_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: skywalking
      POSTGRES_USER: skywalking
      POSTGRES_PASSWORD: ${SW_PG_PASSWORD:-skywalking}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - medagent_skywalking_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skywalking -d skywalking"]
      interval: 10s
      timeout: 5s
      retries: 10

  skywalking-oap:
    image: ${SW_OAP_IMAGE:-apache/skywalking-oap-server:11.0.0}
    container_name: medagent_skywalking_oap
    restart: unless-stopped
    environment:
      SW_STORAGE: postgresql
      SW_JDBC_URL: jdbc:postgresql://skywalking-postgres:5432/skywalking
      SW_DATA_SOURCE_USER: skywalking
      SW_DATA_SOURCE_PASSWORD: ${SW_PG_PASSWORD:-skywalking}
      # 数据保留：明细 3 天 / 指标 7 天（院内 GP 量级足够回溯；按合规要求调整）
      SW_CORE_RECORD_DATA_TTL: "3"
      SW_CORE_METRICS_DATA_TTL: "7"
      # 关闭匿名遥测上报
      SW_TELEMETRY: none
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:11800:11800"
      - "127.0.0.1:12800:12800"
    depends_on:
      skywalking-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:12800/internal/l7check >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  skywalking-ui:
    image: ${SW_UI_IMAGE:-apache/skywalking-ui:11.0.0}
    container_name: medagent_skywalking_ui
    restart: unless-stopped
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      skywalking-oap:
        condition: service_started

  # ---- 指标抓取：Prometheus（G105）----------------------------------------
  # 抓取 AI 中台 /metrics（Bearer METRICS_TOKEN），加载 deploy/prometheus 告警规则。
  #
  # 首次使用（评审 M-17/M-18 整改后的正确步骤）：
  #   1) 先确认挂载路径是**普通文件**而不是目录（Docker 在文件缺失时会自动建同名目录）：
  #        if (Test-Path .\deploy\observability\prometheus\metrics-token -PathType Container) {
  #          Remove-Item -Recurse -Force .\deploy\observability\prometheus\metrics-token }
  #   2) 生成令牌并写入（裸令牌，不带 `Bearer ` 前缀，无 BOM，无尾随换行）：
  #        $t = -join ((48..57)+(97..102) | Get-Random -Count 64 | ForEach-Object {[char]$_})
  #        [IO.File]::WriteAllText("$PWD\deploy\observability\prometheus\metrics-token",
  #          $t, (New-Object Text.UTF8Encoding($false)))
  #   3) 在 .env.local 设置同值 METRICS_TOKEN=$t，重启 AI 中台。
  # 容器启动时会做前置校验：令牌缺失 / 是目录 / 仍是占位符 → 直接退出（restart loop 可见），
  # 而不是"容器 Up、target 永久 down"。
  # 仅本机回环暴露 9090；院区访问请走反向代理与鉴权。
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: medagent_prometheus
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        TOKEN_FILE=/etc/prometheus/metrics-token
        if [ ! -f "$$TOKEN_FILE" ]; then
          echo "FATAL: $$TOKEN_FILE 缺失或不是普通文件（可能是 Docker 自动创建的目录）。" >&2
          echo "       请删除同名目录后写入裸令牌，见 docker-compose.observability.yml 注释。" >&2
          exit 1
        fi
        if grep -q "REPLACE_BEFORE_USE" "$$TOKEN_FILE"; then
          echo "FATAL: $$TOKEN_FILE 仍是占位符，请替换为随机长串（与 METRICS_TOKEN 一致）。" >&2
          exit 1
        fi
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/metrics-token:/etc/prometheus/metrics-token:ro
      - ../../deploy/prometheus:/etc/prometheus/rules:ro
      - medagent_prometheus:/prometheus
    extra_hosts:
      # Linux Docker 访问宿主机；Docker Desktop 原生支持 host.docker.internal
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -q Ready"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- 告警送达：Alertmanager + 本地日志 sink（第 52 批）--------------------
  # Prometheus 规则命中 → alertmanager → alert-sink（仅打印摘要到 stdout）。
  # 验证：docker logs medagent_alert_sink | findstr ALERT_WEBHOOK
  # 生产：把 alertmanager.yml 的 receiver 换成院内短信/IM/工单 Webhook。
  alert-sink:
    image: ${ALERT_SINK_IMAGE:-python:3.11-slim}
    container_name: medagent_alert_sink
    restart: unless-stopped
    command: ["python", "/app/receiver.py"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./alertmanager/receiver.py:/app/receiver.py:ro

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.27.0}
    container_name: medagent_alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - medagent_alertmanager:/alertmanager
    depends_on:
      - alert-sink
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready | grep -q Ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---- 日志采集：Loki + Promtail --------------------------------------------
  # 本地以 Docker API 发现本项目容器并采集 stdout/stderr；
  # K8s 生产环境改用 Promtail/Alloy DaemonSet（见 deploy/README.md「日志采集」）。
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.4.2}
    container_name: medagent_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    environment:
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3100 可能被其他进程占用；容器内仍为 3100，Promtail 走服务名直连
      - "127.0.0.1:${LOKI_HOST_PORT:-3101}:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - medagent_loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.4.2}
    container_name: medagent_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # 采集进度持久化（S16）：否则容器重启后从头重采，重复入栈并造成写入尖峰
      - medagent_promtail_positions:/var/lib/promtail
      # Docker Desktop（Windows）同样支持该 socket 挂载
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

volumes:
  medagent_skywalking_pg:
  medagent_loki:
  medagent_promtail_positions:
  medagent_prometheus:
  medagent_alertmanager:
