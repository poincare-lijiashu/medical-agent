# ============================================================================
# MedAssist 告警规则（Prometheus Operator：monitoring.coreos.com/v1 PrometheusRule）
#
# 依赖指标：
#   * Spring Boot Actuator + Micrometer（/actuator/prometheus，经 ServiceMonitor 抓取）
#       - http_server_requests_seconds_count{component="gateway", status=...}
#       - jvm_memory_used_bytes{component=..., area="heap"}
#     component 标签由 ServiceMonitor 的 relabelings 从 Pod 标签注入
#     （__meta_kubernetes_pod_label_app_kubernetes_io_component）。
#     此前规则用 job 正则匹配 gateway，但 ServiceMonitor 只有一个共享 job 名，
#     导致 5xx/P99 告警永远无数据（M11）。
#   * 业务打点（本平台代码内）
#       - medassist_auth_login_total{result,reason}     auth 登录结果
#       - medassist_gateway_rate_limited_total{resource} 网关入口限流次数
#   * kube-state-metrics
#       - kube_pod_container_status_restarts_total
#       - kube_deployment_status_replicas_unavailable
#
# 部署：
#   kubectl apply -f deploy/observability/alerts/medassist-alerts.yaml
#   labels.release 必须与抓取栈的 ruleSelector 一致（kube-prometheus-stack 默认按
#   Helm release 名选择，prod 的 ServiceMonitor 用的是 kube-prometheus-stack）。
#   若你的 release 名不同，改 metadata.labels.release。
#
# 注意：规则只是"产生告警"，还需要 Alertmanager 的 route/receiver 才会真正送达，
#       样例见 deploy/observability/alerts/alertmanager-routes.example.yaml。
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: medassist-platform-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: medassist-platform
spec:
  groups:
    - name: medassist.availability
      rules:
        - alert: MedassistTargetDown
          expr: up{component=~"gateway|auth|empi|clinical|pharmacy|material|tech|emr|insurance|kb"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "MedAssist 抓取目标不可达（{{ $labels.instance }}）"
            description: "Prometheus 连续 3 分钟无法抓取该实例，可能是 Pod 崩溃或探针失败。"

        - alert: MedassistPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"medassist.*"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "容器反复重启：{{ $labels.pod }}/{{ $labels.container }}"
            description: "15 分钟内重启超过 3 次，检查 CrashLoopBackOff 与启动日志。"

        - alert: MedassistReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace=~"medassist.*"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.deployment }} 存在不可用副本"
            description: "持续 10 分钟有副本不可用，检查就绪探针与资源限制。"

    - name: medassist.http
      rules:
        - alert: MedassistGateway5xxRate
          expr: |
            sum(rate(http_server_requests_seconds_count{component="gateway", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{component="gateway"}[5m])), 0.001)
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "网关 5xx 比例超过 5%"
            description: "近 5 分钟 5xx/总请求 > 5%，先看 SkyWalking 最慢链路与下游错误。"

        - alert: MedassistGatewayP99High
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{component="gateway"}[5m])) by (le)
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "网关 P99 延迟超过 2s"
            description: "检查下游 auth/empi/AI 中台耗时与数据库慢查询。"

        - alert: MedassistGatewayRateLimited
          expr: sum(rate(medassist_gateway_rate_limited_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "网关持续触发入口限流"
            description: "按 resource 标签定位被削峰的接口族；结合登录失败指标判断是否为暴力破解。"

        - alert: MedassistDbPoolPending
          expr: max(hikaricp_connections_pending{component=~"gateway|auth|empi|clinical|pharmacy|material|tech|emr|insurance|kb"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "数据库连接池出现排队（{{ $labels.instance }}）"
            description: "连接池耗尽会直接放大接口延迟，检查慢查询与 maximum-pool-size。"

        - alert: MedassistClinical5xxRate
          expr: |
            sum(rate(http_server_requests_seconds_count{component="clinical", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{component="clinical"}[5m])), 0.001)
            > 0.02
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "临床核心 5xx 比例超过 2%"
            description: "挂号/收费/住院链路错误升高，先看临床服务日志与数据库锁等待（收费结算用行锁）。"

        - alert: MedassistClinicalP99High
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{component="clinical"}[5m])) by (le)
            ) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "临床核心 P99 延迟超过 3s"
            description: "多为数据库慢查询或行锁等待（settle/dailyBill/discharge 均持有 visit 行锁）。"

    - name: medassist.auth
      rules:
        - alert: MedassistAuthLoginFailureSpike
          expr: sum(rate(medassist_auth_login_total{result="failure"}[5m])) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "登录失败速率异常（> 0.2 次/秒）"
            description: "结合 reason 标签区分密码错误/账号不存在；持续升高可能是撞库攻击。"

        - alert: MedassistAuthLoginThrottled
          expr: sum(rate(medassist_auth_login_total{result="failure",reason="throttled"}[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "登录限速持续触发（疑似暴力破解）"
            description: "查看 auth_svc.login_attempt 中 username/client_ip 分布，必要时封禁来源。"

    - name: medassist.internal-auth
      rules:
        # 灰度（log）期看"是否存在绕过网关的直连流量"；切 enforce 后看是否被大范围误伤。
        # 指标来自 common 的 InternalAuthFilter：result=ok|missing|bad_sig|skew|replay|
        # unknown_key|unknown_caller|bad_version|saturated|nonce_store_error
        - alert: MedassistInternalAuthRejectSpike
          expr: sum(rate(medassist_internal_auth_total{result!="ok"}[5m])) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "服务间签名校验拒绝速率异常（> 0.5 次/秒）"
            description: "按 result 区分：missing/bad_sig 多为网关与下游密钥不一致或存在绕过网关的直连调用；
                          replay 需排查重放；saturated 说明 nonce 表被打满（疑似攻击或配置异常）。"

        # P0-S5：共享 nonce 存储（nonce-store=jdbc）不可用时过滤器 fail-closed，
        # 影响是"内部调用全部 403"——必须当故障告警，而不是当作安全事件。
        - alert: MedassistInternalAuthNonceStoreError
          expr: sum(rate(medassist_internal_auth_total{result="nonce_store_error"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "共享 nonce 存储不可用，内部调用正在被 fail-closed 拒绝"
            description: "检查该服务 schema 下 internal_nonce 表是否存在（Flyway 迁移是否成功）与数据库连通性；
                          fail-closed 是预期行为，不要为此关闭校验。"

        - alert: MedassistInternalAuthRejectAllTraffic
          expr: |
            (
              sum(rate(medassist_internal_auth_total{result="ok"}[5m]))
              /
              sum(rate(medassist_internal_auth_total[5m]))
            ) < 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "服务间签名通过率低于 50%（近乎全站被拒）"
            description: "典型原因是密钥未同步（keys-json 不一致）或 active 配置错误；先核对两侧 Secret，再考虑临时切 log 模式止血。"

    - name: medassist.insurance
      rules:
        - alert: MedassistInsuranceCatalogImportFailing
          expr: sum(rate(medassist_insurance_catalog_import_total{result="failed"}[10m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "医保目录文件导入持续失败（> 0.05 次/秒）"
            description: "查看响应体中的行号提示（引号未闭合/列数不符/乙类缺比例）；多为省局文件格式变更。"

        - alert: MedassistInsuranceExportActionFailing
          expr: sum by (action) (rate(medassist_insurance_export_action_total{result="failed"}[10m])) > 0.02
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "医保报盘动作持续失败（action={{ $labels.action }}）"
            description: "create 失败多为期间内无可报清单或全部已报盘；receipt 失败多为重复登记或批次已回执。
                          REJECTED 属业务结果（省局退回），不计入失败，需人工核对退回原因。"

    - name: medassist.jvm
      rules:
        - alert: MedassistJvmHeapHigh
          expr: |
            sum(jvm_memory_used_bytes{component=~"gateway|auth|empi|clinical|pharmacy|material|tech|emr|insurance|kb", area="heap"}) by (instance)
            /
            clamp_min(sum(jvm_memory_max_bytes{component=~"gateway|auth|empi|clinical|pharmacy|material|tech|emr|insurance|kb", area="heap"}) by (instance), 1)
            > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "JVM 堆使用率超过 90%（{{ $labels.instance }}）"
            description: "检查 GC 日志与内存限制；持续高位可能触发 OOMKilled。"

    # ---- 批处理（迁移 / 备份 / 审计归档）失败告警（评测 06 P1-1）----
    # 背景：这些 Job 失败时服务仍然 200、面板全绿——备份停摆、迁移失败、审计归档静默，
    # 直到需要恢复数据时才发现"没有可用的备份/归档"。这里按 kube-state-metrics 的
    # Job/CronJob 状态兜住三类静默失败：Job 失败、CronJob 被挂起、成功时间过期。
    #
    # 兼容性：kube-state-metrics v2.13+ 用 kube_job_failed，旧版用 kube_job_status_failed；
    # 两条用 `or` 合并（同一 namespace/job_name 标签），集群升级不会出现"规则无数据"。
    - name: medassist.batch
      rules:
        - alert: MedassistJobFailed
          expr: |
            (max by (namespace, job_name) (kube_job_failed{namespace=~"medassist.*"} > 0))
            or
            (max by (namespace, job_name) (kube_job_status_failed{namespace=~"medassist.*"} > 0))
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "批处理 Job 失败：{{ $labels.namespace }}/{{ $labels.job_name }}"
            description: "迁移/备份/审计归档等 Job 失败不会自动恢复。查看该 Job 的 Pod 日志与 events；
                          若是备份或归档失败，先确认数据仍可恢复，再重跑。"

        - alert: MedassistCronJobSuspended
          expr: kube_cronjob_spec_suspend{namespace=~"medassist.*"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "CronJob 被挂起：{{ $labels.namespace }}/{{ $labels.cronjob }}"
            description: "挂起期间不会产生新的备份/归档。确认是计划内维护，否则恢复调度（kubectl patch ... suspend=false）。"

        - alert: MedassistBackupStale
          expr: |
            time() - max by (namespace, cronjob) (
              kube_cronjob_status_last_successful_time{namespace=~"medassist.*", cronjob=~".*pg-backup.*"})
            > 93600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL 备份超过 26 小时未成功（{{ $labels.cronjob }}）"
            description: "RPO 已劣化到 > 24h。检查备份 CronJob 的 Pod 日志、备份盘容量与 PG 口令 Secret。"

        - alert: MedassistAuditArchiveStale
          expr: |
            time() - max by (namespace, cronjob) (
              kube_cronjob_status_last_successful_time{namespace=~"medassist.*", cronjob=~".*audit-archive.*"})
            > 691200
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "审计归档超过 8 天未成功（{{ $labels.cronjob }}）"
            description: "归档是每周任务；连续错过一个周期说明 CronJob 失败或被挂起，热表将持续膨胀并影响保留期合规。"

    # ========================================================================
    # 第 268 批：SLO 与错误预算（见 docs/SLO-20261111.md）
    #
    # 口径：
    #   * 可用性 SLI = 1 - 5xx / 全部服务端请求；4xx 是客户端错误，不计入不可用；
    #   * 99.95% 月预算 = 0.05%，14.4x 快烧 = 0.72%，6x 慢烧 = 0.30%；
    #   * 429 不计入可用性（限流是保护动作），但单独用 throttle 比例告警；
    #   * 延迟只看成功请求的直方图，避免把 5xx 的快速失败算成"低延迟"。
    # ========================================================================
    - name: medassist.slo
      rules:
        - alert: MedassistGatewayAvailabilityBudgetFastBurn
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{component="gateway", status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{component="gateway"}[5m])), 0.001)
            ) > 0.0072
            and
            (
              sum(rate(http_server_requests_seconds_count{component="gateway", status=~"5.."}[1h]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{component="gateway"}[1h])), 0.001)
            ) > 0.0072
          for: 2m
          labels:
            severity: critical
            slo: gateway-availability
          annotations:
            summary: "网关可用性 SLO 快烧（5m/1h 均 > 14.4x 错误预算）"
            description: "目标 99.95%；先看下游 5xx 来源与最近发布，必要时按 docs/SLO-20261111.md 的预算策略冻结变更。"

        - alert: MedassistGatewayAvailabilityBudgetSlowBurn
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{component="gateway", status=~"5.."}[30m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{component="gateway"}[30m])), 0.001)
            ) > 0.003
            and
            (
              sum(rate(http_server_requests_seconds_count{component="gateway", status=~"5.."}[6h]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{component="gateway"}[6h])), 0.001)
            ) > 0.003
          for: 15m
          labels:
            severity: warning
            slo: gateway-availability
          annotations:
            summary: "网关可用性 SLO 慢烧（30m/6h 均 > 6x 错误预算）"
            description: "不是瞬时抖动；按科室/接口拆 5xx，确认是否为同一依赖或同一版本引入。"

        - alert: MedassistAuthAvailabilityBudgetFastBurn
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{component="auth", status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{component="auth"}[5m])), 0.001)
            ) > 0.0072
            and
            (
              sum(rate(http_server_requests_seconds_count{component="auth", status=~"5.."}[1h]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{component="auth"}[1h])), 0.001)
            ) > 0.0072
          for: 2m
          labels:
            severity: critical
            slo: auth-availability
          annotations:
            summary: "认证可用性 SLO 快烧（5m/1h 均 > 14.4x 错误预算）"
            description: "认证不可用会阻断全部登录；先确认 PG 与 auth 实例，再考虑降级到只读/备用节点。"

        - alert: MedassistClinicalLatencyP95High
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{component="clinical", status!~"5.."}[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            slo: clinical-latency
          annotations:
            summary: "临床核心读 P95 超过 500ms"
            description: "目标 p95 < 500ms；先看慢 SQL/行锁与 N+1，再看是否被报表/导出类重查询挤占。"

        - alert: MedassistPharmacyTechLatencyP95High
          expr: |
            histogram_quantile(0.95,
              sum by (component, le) (rate(http_server_requests_seconds_bucket{component=~"pharmacy|tech", status!~"5.."}[5m]))
            ) > 0.8
          for: 10m
          labels:
            severity: warning
            slo: pharmacy-tech-latency
          annotations:
            summary: "药事/医技 P95 超过 800ms（{{ $labels.component }}）"
            description: "目标 p95 < 800ms；药房先看库存/批次锁，医技先看设备接口与报告生成。"

        - alert: MedassistGatewayThrottleRateHigh
          expr: |
            sum(rate(medassist_gateway_rate_limited_total[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{component="gateway"}[5m])), 0.001)
            > 0.02
          for: 10m
          labels:
            severity: warning
            slo: gateway-throttle
          annotations:
            summary: "网关限流比例超过 2%"
            description: "限流保护生效但已影响业务；检查异常客户端、护理站轮询频率与容量基线（docs/CAPACITY-MODEL-20261111.md）。"
