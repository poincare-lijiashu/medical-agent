# ============================================================================
# MedAssist 告警规则（Prometheus Operator：monitoring.coreos.com/v1 PrometheusRule）
#
# 依赖指标：
#   * Spring Boot Actuator + Micrometer（/actuator/prometheus，经 ServiceMonitor 抓取）
#       - http_server_requests_seconds_count{component="gateway", status=...}
#       - jvm_memory_used_bytes{component=..., area="heap"}
#     component 标签由 ServiceMonitor 的 relabelings 从 Pod 标签注入
#     （__meta_kubernetes_pod_label_app_kubernetes_io_component）。
#     此前规则用 job 正则匹配 gateway，但 ServiceMonitor 只有一个共享 job 名，
#     导致 5xx/P99 告警永远无数据（M11）。
#   * 业务打点（本平台代码内）
#       - medassist_auth_login_total{result,reason}     auth 登录结果
#       - medassist_gateway_rate_limited_total{resource} 网关入口限流次数
#   * kube-state-metrics
#       - kube_pod_container_status_restarts_total
#       - kube_deployment_status_replicas_unavailable
#
# 部署：
#   kubectl apply -f deploy/observability/alerts/medassist-alerts.yaml
#   labels.release 必须与抓取栈的 ruleSelector 一致（kube-prometheus-stack 默认按
#   Helm release 名选择，prod 的 ServiceMonitor 用的是 kube-prometheus-stack）。
#   若你的 release 名不同，改 metadata.labels.release。
#
# 注意：规则只是"产生告警"，还需要 Alertmanager 的 route/receiver 才会真正送达，
#       样例见 deploy/observability/alerts/alertmanager-routes.example.yaml。
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: medassist-platform-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: medassist-platform
spec:
  groups:
    - name: medassist.availability
      rules:
        - alert: MedassistTargetDown
          expr: up{component=~"gateway|auth|empi|clinical|pharmacy|tech|emr|insurance|kb"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "MedAssist 抓取目标不可达（{{ $labels.instance }}）"
            description: "Prometheus 连续 3 分钟无法抓取该实例，可能是 Pod 崩溃或探针失败。"

        - alert: MedassistPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"medassist.*"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "容器反复重启：{{ $labels.pod }}/{{ $labels.container }}"
            description: "15 分钟内重启超过 3 次，检查 CrashLoopBackOff 与启动日志。"

        - alert: MedassistReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace=~"medassist.*"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.deployment }} 存在不可用副本"
            description: "持续 10 分钟有副本不可用，检查就绪探针与资源限制。"

    - name: medassist.http
      rules:
        - alert: MedassistGateway5xxRate
          expr: |
            sum(rate(http_server_requests_seconds_count{component="gateway", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{component="gateway"}[5m])), 0.001)
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "网关 5xx 比例超过 5%"
            description: "近 5 分钟 5xx/总请求 > 5%，先看 SkyWalking 最慢链路与下游错误。"

        - alert: MedassistGatewayP99High
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{component="gateway"}[5m])) by (le)
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "网关 P99 延迟超过 2s"
            description: "检查下游 auth/empi/AI 中台耗时与数据库慢查询。"

        - alert: MedassistGatewayRateLimited
          expr: sum(rate(medassist_gateway_rate_limited_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "网关持续触发入口限流"
            description: "按 resource 标签定位被削峰的接口族；结合登录失败指标判断是否为暴力破解。"

        - alert: MedassistDbPoolPending
          expr: max(hikaricp_connections_pending{component=~"gateway|auth|empi|clinical|pharmacy|tech|emr|insurance|kb"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "数据库连接池出现排队（{{ $labels.instance }}）"
            description: "连接池耗尽会直接放大接口延迟，检查慢查询与 maximum-pool-size。"

        - alert: MedassistClinical5xxRate
          expr: |
            sum(rate(http_server_requests_seconds_count{component="clinical", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{component="clinical"}[5m])), 0.001)
            > 0.02
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "临床核心 5xx 比例超过 2%"
            description: "挂号/收费/住院链路错误升高，先看临床服务日志与数据库锁等待（收费结算用行锁）。"

        - alert: MedassistClinicalP99High
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{component="clinical"}[5m])) by (le)
            ) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "临床核心 P99 延迟超过 3s"
            description: "多为数据库慢查询或行锁等待（settle/dailyBill/discharge 均持有 visit 行锁）。"

    - name: medassist.auth
      rules:
        - alert: MedassistAuthLoginFailureSpike
          expr: sum(rate(medassist_auth_login_total{result="failure"}[5m])) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "登录失败速率异常（> 0.2 次/秒）"
            description: "结合 reason 标签区分密码错误/账号不存在；持续升高可能是撞库攻击。"

        - alert: MedassistAuthLoginThrottled
          expr: sum(rate(medassist_auth_login_total{result="failure",reason="throttled"}[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "登录限速持续触发（疑似暴力破解）"
            description: "查看 auth_svc.login_attempt 中 username/client_ip 分布，必要时封禁来源。"

    - name: medassist.internal-auth
      rules:
        # 灰度（log）期看"是否存在绕过网关的直连流量"；切 enforce 后看是否被大范围误伤。
        # 指标来自 common 的 InternalAuthFilter：result=ok|missing|bad_sig|skew|replay|
        # unknown_key|unknown_caller|bad_version|saturated|nonce_store_error
        - alert: MedassistInternalAuthRejectSpike
          expr: sum(rate(medassist_internal_auth_total{result!="ok"}[5m])) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "服务间签名校验拒绝速率异常（> 0.5 次/秒）"
            description: "按 result 区分：missing/bad_sig 多为网关与下游密钥不一致或存在绕过网关的直连调用；
                          replay 需排查重放；saturated 说明 nonce 表被打满（疑似攻击或配置异常）。"

        # P0-S5：共享 nonce 存储（nonce-store=jdbc）不可用时过滤器 fail-closed，
        # 影响是"内部调用全部 403"——必须当故障告警，而不是当作安全事件。
        - alert: MedassistInternalAuthNonceStoreError
          expr: sum(rate(medassist_internal_auth_total{result="nonce_store_error"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "共享 nonce 存储不可用，内部调用正在被 fail-closed 拒绝"
            description: "检查该服务 schema 下 internal_nonce 表是否存在（Flyway 迁移是否成功）与数据库连通性；
                          fail-closed 是预期行为，不要为此关闭校验。"

        - alert: MedassistInternalAuthRejectAllTraffic
          expr: |
            (
              sum(rate(medassist_internal_auth_total{result="ok"}[5m]))
              /
              sum(rate(medassist_internal_auth_total[5m]))
            ) < 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "服务间签名通过率低于 50%（近乎全站被拒）"
            description: "典型原因是密钥未同步（keys-json 不一致）或 active 配置错误；先核对两侧 Secret，再考虑临时切 log 模式止血。"

    - name: medassist.insurance
      rules:
        - alert: MedassistInsuranceCatalogImportFailing
          expr: sum(rate(medassist_insurance_catalog_import_total{result="failed"}[10m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "医保目录文件导入持续失败（> 0.05 次/秒）"
            description: "查看响应体中的行号提示（引号未闭合/列数不符/乙类缺比例）；多为省局文件格式变更。"

        - alert: MedassistInsuranceExportActionFailing
          expr: sum by (action) (rate(medassist_insurance_export_action_total{result="failed"}[10m])) > 0.02
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "医保报盘动作持续失败（action={{ $labels.action }}）"
            description: "create 失败多为期间内无可报清单或全部已报盘；receipt 失败多为重复登记或批次已回执。
                          REJECTED 属业务结果（省局退回），不计入失败，需人工核对退回原因。"

    - name: medassist.jvm
      rules:
        - alert: MedassistJvmHeapHigh
          expr: |
            sum(jvm_memory_used_bytes{component=~"gateway|auth|empi|clinical|pharmacy|tech|emr|insurance|kb", area="heap"}) by (instance)
            /
            clamp_min(sum(jvm_memory_max_bytes{component=~"gateway|auth|empi|clinical|pharmacy|tech|emr|insurance|kb", area="heap"}) by (instance), 1)
            > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "JVM 堆使用率超过 90%（{{ $labels.instance }}）"
            description: "检查 GC 日志与内存限制；持续高位可能触发 OOMKilled。"
