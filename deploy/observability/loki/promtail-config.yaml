# ============================================================================
# Promtail 采集配置（本地 compose 形态：经 Docker API 发现容器并读取日志）
#
# 标签约定：
#   service  = compose service 名（gateway / auth / empi / ai-core ...）
#   container= 容器名
#   stream   = stdout / stderr
#
# K8s 生产环境不用本文件：改用 Promtail/Alloy DaemonSet（按 namespace=medassist 过滤），
# 对应清单与标签建议见 deploy/README.md「日志采集」章节。
# ============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # 放进持久卷（S16）：放在 /tmp 会随容器重启丢失，导致日志从头重复采集、写入尖峰
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# 检索提示（M12）：Java 服务日志已带 traceId（形如 [3f2a...32位十六进制]），
# 用 LogQL 行过滤串联链路，例如：
#   {container="gw-test"} |= "<traceId>"
# 刻意不把 traceId 做成标签——高基数标签会撑爆 Loki 索引。

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # 只采集本项目容器（compose project 名为 medagent）
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: medagent
        action: keep
    pipeline_stages:
      - docker: {}
