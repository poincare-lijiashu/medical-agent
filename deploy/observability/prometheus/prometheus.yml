# ============================================================================
# 本地/院区自建 Prometheus 抓取配置（G105）
#
# 抓取目标：AI 中台 http://host.docker.internal:8001/metrics
# 鉴权：authorization.type=Bearer + credentials_file（与后端 .env.local 的 METRICS_TOKEN 一致）。
#
# 令牌文件规则（评审 M-18 整改，按重要性排序）：
#   1) 文件内容 = **裸令牌**，不要带 `Bearer ` 前缀——Prometheus 会自己拼前缀，
#      带前缀会变成 `Bearer Bearer xxx` → 401；
#   2) 必须是普通文件，不能是目录（缺文件时 Docker 会自动建同名目录，见 compose 注释）；
#   3) **不能有 BOM**（Prometheus 只 TrimSpace，不去 BOM）；尾随换行/空白无害；
#   4) 令牌文件不入版本库：先复制 metrics-token.example 为 metrics-token 并替换为随机长串。
#   Windows 建议：
#       [IO.File]::WriteAllText($path, $token, (New-Object Text.UTF8Encoding($false)))
#
# 告警规则：/etc/prometheus/rules/*.yml 来自 deploy/prometheus/（含 G97/G102 规则）。
# ============================================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: medassist-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: medassist-ai-core
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          component: ai-core
