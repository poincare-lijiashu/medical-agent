# ============================================================================
# 本地/院区自建 Prometheus 抓取配置（G105）
#
# 抓取目标：AI 中台 http://host.docker.internal:8001/metrics
# 鉴权：authorization.type=Bearer + credentials_file（与后端 .env.local 的 METRICS_TOKEN 一致）。
#
# 令牌文件规则（评审 M-18 整改，按重要性排序）：
#   1) 文件内容 = **裸令牌**，不要带 `Bearer ` 前缀——Prometheus 会自己拼前缀，
#      带前缀会变成 `Bearer Bearer xxx` → 401；
#   2) 必须是普通文件，不能是目录（缺文件时 Docker 会自动建同名目录，见 compose 注释）；
#   3) **不能有 BOM**（Prometheus 只 TrimSpace，不去 BOM）；尾随换行/空白无害；
#   4) 令牌文件不入版本库：先复制 metrics-token.example 为 metrics-token 并替换为随机长串。
#   Windows 建议：
#       [IO.File]::WriteAllText($path, $token, (New-Object Text.UTF8Encoding($false)))
#
# 告警规则：/etc/prometheus/rules/*.yml 来自 deploy/prometheus/（含 G97/G102 规则）。
# ============================================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: medassist-local

rule_files:
  - /etc/prometheus/rules/*.yml

# 第 52 批：规则命中后投递到 Alertmanager（本地形态再转 alert-sink 日志）。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: medassist-ai-core
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      # 注意（评审 06-S5）：host.docker.internal 在 Docker Desktop 上解析到宿主机，
      # 但在 **Linux Docker Engine** 下 host-gateway 解析到 docker0 网关，访问不到只监听
      # 127.0.0.1:8001 的 AI 中台。Linux 部署请让 AI 中台监听 SERVER_HOST=0.0.0.0，
      # 或改用 network_mode: host / 同 compose 服务名直连。
      - targets: ["host.docker.internal:8001"]
        labels:
          component: ai-core

  # 第 287 批：auth 暴露租户健康度指标（medassist_tenant_*），供按院告警使用。
  # 指标值来自 auth 内 60s 一次的定时刷新，抓取本身不触发任何 JDBC 探测。
  # 生产形态：每个 Cell 一套 auth，Prometheus 侧给每个 target 打 tenant 标签；
  # 本文件是本地共享实例（tenant 标签由指标自身携带）。
  - job_name: medassist-auth
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          component: auth
