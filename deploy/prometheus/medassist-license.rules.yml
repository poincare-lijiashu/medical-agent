# ============================================================================
# 授权到期与配额告警（第 288 批）
#
# 数据来源：license 服务 /actuator/prometheus（medassist_license_*，按 instance 标签）。
# 为什么必须有：授权到期后模块门禁会拦截业务，不能等临床发现"系统不能用了"才处理。
# ============================================================================
groups:
  - name: medassist-license
    rules:
      - alert: MedassistLicenseExpired
        expr: medassist_license_phase{phase="EXPIRED"} == 1
        for: 5m
        labels:
          severity: critical
          component: license
        annotations:
          summary: "实例 {{ $labels.instance }} 的授权已过期且超出宽限期"
          description: "模块门禁将拦截业务访问。立即导入续期授权书；未续期前按合同进入停服流程。"
          runbook: "docs/PROVISIONING-RUNBOOK.md#11-授权签发导入与到期288"

      - alert: MedassistLicenseGrace
        expr: medassist_license_phase{phase="GRACE"} == 1
        for: 1h
        labels:
          severity: warning
          component: license
        annotations:
          summary: "实例 {{ $labels.instance }} 的授权已到期，处于宽限期"
          description: "宽限期内只告警不阻断，结束前必须完成续期：剩余 {{ $value }} 天（见 medassist_license_days_left）。"

      - alert: MedassistLicenseExpiringSoon
        expr: medassist_license_days_left >= 0 and medassist_license_days_left < 30
        for: 6h
        labels:
          severity: warning
          component: license
        annotations:
          summary: "实例 {{ $labels.instance }} 的授权将在 30 天内到期"
          description: "剩余 {{ $value }} 天，请启动续签流程（合同、用印、签发至少预留两周）。"

      - alert: MedassistLicenseMissing
        expr: medassist_license_phase{phase="NONE"} == 1
        for: 24h
        labels:
          severity: warning
          component: license
        annotations:
          summary: "实例 {{ $labels.instance }} 尚未导入授权书"
          description: "观察模式下不拦截业务，但商业交付必须完成授权导入与验收。"

      - alert: MedassistLicenseQuotaExceeded
        expr: medassist_license_quota_exceeded == 1
        for: 2h
        labels:
          severity: warning
          component: license
        annotations:
          summary: "实例 {{ $labels.instance }} 配额超限：{{ $labels.quota }}"
          description: "配额对照按每日用量快照计算；持续超限需要扩容或修正上报口径。临床连续性优先，不自动阻断。"

      # §289：AI 中台每 60 秒推送一次用量，正常新鲜度应在分钟级。
      # 26 小时阈值容忍一次夜间维护窗口；超过即视为"自动对账链路断了"，
      # 此时配额页的数字不可再用于商务判断。
      - alert: MedassistLicenseUsageStale
        expr: medassist_license_usage_age_seconds > 93600
        for: 1h
        labels:
          severity: warning
          component: license
        annotations:
          summary: "实例 {{ $labels.instance }} 的用量快照已超过 26 小时未更新"
          description: "确认 AI 中台是否配置了 PLATFORM_LICENSE_BASE_URL/INTERNAL_API_TOKEN，以及 8095 是否可达；否则配额告警与对账全部失效。"
          runbook: "docs/PROVISIONING-RUNBOOK.md#12-ai-用量自动上报与配额对账289"

      # 上报链路存在但不成功（令牌错误/日期被拒）：授权服务侧能看见失败计数。
      - alert: MedassistLicenseUsageIngestRejected
        expr: increase(medassist_license_usage_ingest_total{result!="ok"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
          component: license
        annotations:
          summary: "实例 {{ $labels.instance }} 收到非法的 AI 用量上报（result={{ $labels.result }}）"
          description: "常见原因：内部令牌不一致、按 UTC 日切上报了过期日期、计数超出合理范围。查看 license 日志中的 usage 相关 WARN。"
