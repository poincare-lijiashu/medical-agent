# 审计归档 CronJob：模板 tag 为空时回落 Chart.AppVersion（当前为 0.1.0-SNAPSHOT），
# 生产必须显式钉住不可变版本，避免"发布成功但镜像没换"。
# 归档目录必须挂持久卷：未配 pvc 时模板直接 fail（emptyDir 会丢归档），
# 生产开启前请填 auditArchive.pvc 并把 enabled 改为 true（保留期需院方确认）。
auditArchive:
  image: {repository: medassist-platform, tag: "1.0.0", pullPolicy: IfNotPresent}
  timeZone: Asia/Shanghai
  allowEmptyDir: false

aiCore:
  enabled: true
  # 与 deploy/README.md 的安装命令（--set aiCore.image.tag=1.0.0）保持一致：
  # 生产显式钉不可变版本，不依赖 values.yaml 的 0.1.0 默认值。
  image: {repository: ai-core, tag: "1.0.0", pullPolicy: IfNotPresent}
  # 单副本：AI 中台的审计/复核队列/知识库任务仍落 /app/data 下的 JSON 文件
  # （多副本并发写会互相覆盖）。扩容前必须先把这些状态迁到 PG/Redis，
  # 再把 models/data 换成共享存储（ReadOnlyMany/RWX）并开启 PDB。
  replicaCount: 1
  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {cpu: "6", memory: 8Gi}
  env:
    APP_ENV: production
    # 有 GPU 节点时改 cuda，并配置 nodeSelector/tolerations（见 deploy/README.md）
    EMBED_DEVICE: cpu
    # 院内默认无外网：关闭 PubMed 检索（不产生任何外网等待）。
    # 若院方开通了 NCBI 白名单，可改回 "true"。
    PUBMED_ENABLED: "false"
  # 评测 06 P1-3/P1-4：连接池上限必须计入全院 max_connections 预算后再定。
  # 2 副本 × 10 连接 = 20；叠加 10 个 Java 服务与监控导出仍应留 ≥30% 余量。
  pgPool:
    min: 2
    max: 10
  # 受信代理：填 ingress-nginx（或前置网关）的 Pod 网段；默认留空 = 不信任任何 XFF。
  trustedProxies: ""
  auditTimezone: Asia/Shanghai
  # 生产必须由存储团队预置模型 PVC（建议共享存储 ReadOnlyMany，多副本共享同一份权重）
  models: {existingClaim: medassist-models, create: false}
  data: {existingClaim: medassist-ai-core-data, create: false}
  nodeSelector: {}
  tolerations: []

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    # 医院内网大文件（教材 PDF）与 SSE 长连接：体上限与读超时必须放大
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: medassist.hospital.local
      paths:
        - {path: /api/v2, pathType: Prefix, service: gateway}
        - {path: /api/v1, pathType: Prefix, service: gateway}
        # 第 173 批：内部接口经网关统一 404，不落到 "/" 兜底的 ai-core
        - {path: /internal, pathType: Prefix, service: gateway}
        # 第 175 批：API 文档在预发布/生产入口一律 404（网关 deny-paths 第二道门）
        - {path: /docs, pathType: Prefix, service: gateway}
        - {path: /redoc, pathType: Prefix, service: gateway}
        - {path: /openapi.json, pathType: Prefix, service: gateway}
        - {path: /, pathType: Prefix, service: aiCore}
  tls:
    - secretName: medassist-prod-tls
      hosts: [medassist.hospital.local]

fhir:
  # FHIR Bundle 的 fullUrl/self 必须是对外可回查地址（见 deployment-fhir.yaml）
  baseUrl: https://medassist.hospital.local/api/v2/fhir

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack
  # 评审 M-19：显式声明 ai-core 抓取状态，避免"ServiceMonitor 开着 = 指标都在采"的误判。
  # 启用前必须先创建同 namespace Secret（键 metrics-token），否则 ai-core Pod 会
  # CreateContainerConfigError / CrashLoop（secretKeyRef 默认 optional=false）。
  #
  # 评测 06 P0-2（E7）：生产**默认开启** AI 中台抓取与 25 条 Agent 告警规则——
  # 此前两者都是 false，导致问答量/错误率/token/P95/PG 慢查询/Milvus 降级在生产集群
  # 里一条都抓不到、25 条告警一条都不生效（服务 200，面板全绿）。
  # 上线前置（部署前必须完成，否则 Pod 起不来）：
  #   kubectl -n medassist-prod create secret generic medassist-metrics \
  #     --from-literal=metrics-token=$(openssl rand -hex 32)
  # 并确保 AI 中台 .env/Secret 的 METRICS_TOKEN 与上值一致。
  aiCore:
    enabled: true
    tokenSecretName: medassist-metrics
    tokenSecretKey: metrics-token
  # 评审 M-15：K8s 形态必须部署 PrometheusRule，否则 G97/G102 规则不生效。
  rules:
    enabled: true
