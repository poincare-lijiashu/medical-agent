# 本地 kind / minikube 自验覆盖值（不是生产配置）
#
# 特点：
# - secrets.create=true：由 Chart 生成自验用 Secret（钩子迁移关闭，应用自行迁移）
# - Nacos / SkyWalking / Ingress / NetworkPolicy 关闭：本地不拉起外部底座
# - AI 中台默认关闭：模型权重 4.3GB 不在本地镜像里；需要时开启并 create PVC 自行灌模型
#
# 用法：
#   helm upgrade --install medassist deploy/helm/medassist-platform \
#     -n medassist --create-namespace -f values.yaml -f values-dev.yaml
# 本地 kind/minikube：业务镜像由本机构建，tag 为 medassist/platform-*，因此前缀写 medassist
imageRegistry: medassist

secrets:
  create: true
  postgresUsername: medagent
  postgresPassword: medagent123
  nacosUsername: nacos
  nacosPassword: nacos
  jwtSecret: "dev-only-jwt-secret-0123456789abcdef0123456789"
  empiFieldKey: "DJuxRns5JAQu23iM3uFqcDhlUAFv9qBqedxWVK55UE4="
  empiHashSalt: "medassist-empi-salt"
  internalApiToken: "dev-only-internal-api-token-0123456789abcdef"
  # 本地自验密钥（base64 32 字节）；生产必须由密钥管理生成，禁止使用本值。
  # 阶段二：调用方密钥拆成独立键（clinical/emr/...），不再塞进 keys-json，
  # 这样每个 Pod 只挂载自己需要的条目（R5-M3）。
  internalHmacKeys: '{"active":"gw-dev","keys":{"gw-dev":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}}'
  # 本地自验 Ed25519 网关密钥对（私钥只挂到网关；生产由密钥管理生成，禁止使用本值）
  internalHmacGatewayPrivateKey: "MC4CAQAwBQYDK2VwBCIEINDcfZdPSmSnEW0FLthFxoudUwEZgBw0QpGr/9h2ck9w"
  internalHmacGatewayPublicKey: "MCowBQYDK2VwAyEAz1qL3EpbsXBMYYM5vxG03IXNAKkJmd4ZVGj3EwjkpOM="
  internalCallerKeys:
    clinical: "bWVkYXNzaXN0LWRldi1jbGluaWNhbC0tLS0tLS0tLS0="
    emr: "bWVkYXNzaXN0LWRldi1lbXItLS0tLS0tLS0tLS0tLS0="
    insurance: "bWVkYXNzaXN0LWRldi1pbnN1cmFuY2UtLS0tLS0tLS0="
    pharmacy: "bWVkYXNzaXN0LWRldi1waGFybWFjeS0tLS0tLS0tLS0="
    tech: "bWVkYXNzaXN0LWRldi10ZWNoLS0tLS0tLS0tLS0tLS0="

# 本地默认只打点不拦截：便于观察是否存在绕过网关的直连调用。
# 本地直接跑 v2（Ed25519）验证阶段二链路，业务服务同时保留 keys-json 兼容 v1。
internalAuth:
  mode: log
  gatewaySigning: ed25519
  acceptEd25519: true
  mountCallerKeys: true

external:
  postgres:
    host: postgres.medassist-infra.svc.cluster.local
    port: 5432
    database: medagent
  nacos:
    enabled: false
  skywalking:
    enabled: false
  milvus:
    uri: http://milvus.medassist-infra.svc.cluster.local:19530

# 本地让应用自行迁移（PreSync 钩子早于 Chart 内 Secret 创建，secrets.create 时不可用）
migration:
  enabled: false

gateway:
  replicaCount: 1
  autoscaling: {enabled: false}
  podDisruptionBudget: {enabled: false}
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 500m, memory: 768Mi}

auth:
  replicaCount: 1
  autoscaling: {enabled: false}
  podDisruptionBudget: {enabled: false}
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 500m, memory: 768Mi}

empi:
  replicaCount: 1
  autoscaling: {enabled: false}
  podDisruptionBudget: {enabled: false}
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 500m, memory: 768Mi}

clinical:
  replicaCount: 1
  autoscaling: {enabled: false}
  podDisruptionBudget: {enabled: false}
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 500m, memory: 768Mi}

