kb:
  replicaCount: 1
  autoscaling: {enabled: false}
  podDisruptionBudget: {enabled: false}
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 500m, memory: 768Mi}

aiCore:
  enabled: false
  models: {existingClaim: "", create: true, size: 1Gi}
  data: {existingClaim: "", create: true, size: 1Gi}

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: medassist.local
      paths:
        - {path: /api/v2, pathType: Prefix, service: gateway}
        - {path: /api/v1, pathType: Prefix, service: gateway}
        - {path: /, pathType: Prefix, service: aiCore}

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
