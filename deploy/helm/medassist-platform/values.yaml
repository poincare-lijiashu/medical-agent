# ============================================================================
# MedAssist 平台 Helm values（生产默认值）
#
# 设计原则：
# 1) 本 Chart 只部署无状态业务服务。PostgreSQL / Nacos / SkyWalking OAP 等有状态
#    中间件由平台组统一提供（可复用集群既有实例），通过 external.* 注入连接信息；
#    避免每个业务 Chart 自带一套数据库导致备份、升级、监控各自为政。
# 2) 密钥不落 values：默认引用预先创建的 Secret（推荐 External Secrets / Sealed
#    Secrets 从密钥管理系统同步）；仅本地 kind/minikube 验证可用 secrets.create=true。
# 3) 在线业务默认 2 副本 + PDB；数据库迁移由 Helm PreSync Hook Job 前置执行，
#    应用侧关闭 Flyway，避免多副本争抢迁移锁（详见 templates/job-migrate-*.yaml）。
# ============================================================================

# 院内镜像仓库前缀（如 harbor.hospital.local/medassist）；留空表示直接用 repository 全名。
# 各服务的 repository 是"仓库内的项目名"（如 platform-gateway），最终镜像为
#   {imageRegistry}/{repository}:{tag}
# 因此这里不要再带 /medassist 后缀，否则会拼成 medassist/medassist/...（三层）。
# 本地 kind 自验请在 values-dev.yaml 设 imageRegistry=medassist。
imageRegistry: ""

# 环境标识：dev | staging | production
# 非 dev 环境禁止渲染 SNAPSHOT 镜像 tag（_helpers.tpl 的 medassist.image 会直接 fail），
# 避免"预发布/生产实际跑的是一个可变的快照版本"（M9）。
environment: dev

nameOverride: ""
fullnameOverride: ""

global:
  timezone: Asia/Shanghai
  springProfiles: k8s
  imagePullSecrets: []

# ---- 外部中间件（必须由平台组提供）----
external:
  postgres:
    host: postgres.database.svc.cluster.local
    port: 5432
    database: medagent
    existingSecret: medassist-postgres
    secretKeys:
      username: username
      password: password

  nacos:
    enabled: true
    serverAddr: nacos.medassist-infra.svc.cluster.local:8848
    # 生产按环境隔离命名空间（空=public）；Java 侧与 Python 侧必须一致
    namespace: ""
    existingSecret: medassist-nacos
    secretKeys:
      username: username
      password: password

  jwt:
    issuer: medassist-auth
    # 访问令牌 30 分钟；P1 引入轮换式刷新令牌（7 天），登出/停用经撤销名单 15s 内生效
    ttl: PT30M
    refreshTtl: P7D
    existingSecret: medassist-jwt
    secretKey: secret

  # SkyWalking OAP（Java agent 与 Python agent 共用同一后端）
  skywalking:
    enabled: true
    oapEndpoint: skywalking-oap.observability.svc.cluster.local:11800
    agentImage: apache/skywalking-java-agent:9.8.0-java21
    # 采样：-1 = 全量采样（医疗内网 QPS 低，全量可直接支撑审计与排障）；
    # 高并发网关可按 3 秒窗口限采样数（如 3000）
    sampleNPer3Secs: -1
    agentLogLevel: INFO
    # 服务端框架插件默认位于 agent 的 optional-plugins/，不激活就只有心跳没有链路
    # （2026-10-30 实测：未激活时 gateway/auth/empi 均无 trace）。initContainer 会复制下列
    # 通配符匹配的 jar 到 plugins/；不匹配的插件不会激活，属于无害冗余。
    optionalPlugins:
      - "apm-spring-cloud-gateway-4.x-plugin-*.jar"
      - "apm-spring-webflux-6.x-plugin-*.jar"
      - "apm-springmvc-annotation-6.x-plugin-*.jar"

  # 患者敏感字段加密密钥（EMPI 专用；换密钥会导致存量密文不可解，必须走轮换流程）
  empi:
    existingSecret: medassist-empi
    secretKeys:
      fieldKey: field-key      # Base64 编码的 32 字节 AES-256 密钥
      hashSalt: hash-salt      # 查重哈希盐（与密钥分离保管）

  # Python AI 中台依赖的向量库
  milvus:
    uri: http://milvus.medassist-infra.svc.cluster.local:19530
    # 开启 Milvus 鉴权时提供（未开启留空即可）；Secret 中键名 token
    existingSecret: ""
    secretKey: token

  # Redis：AI 中台多副本的共享状态后端（登录/问答限流计数、会话记忆、令牌撤销时间戳）。
  # 关闭时退化为进程内内存——单副本可用，多副本会各算各的（限流失真、会话串号）；
  # 因此 staging/production 必须开启（见 values-staging.yaml / values-prod.yaml）。
  redis:
    enabled: false
    # Secret 中存放完整连接串（redis://:密码@host:6379/0），键名 url
    existingSecret: medassist-redis
    secretKey: url

  # 服务间内部接口令牌（clinical → empi 查询患者；empi 侧 INTERNAL_API_TOKEN）
  internalApi:
    existingSecret: medassist-internal
    secretKey: token

  # 服务间 HMAC 签名密钥（MF-07）：网关 → 业务服务。
  # Secret 内为 JSON：{"active":"gw-2026-11","keys":{"gw-2026-11":"<base64 32B>"}}；
  # 轮换期 keys 同时保留新旧两把，切换 active 后观察 7 天再删旧 key。
  # 生成：openssl rand -base64 32（禁止人工设定、禁止进 Git）。
  internalHmac:
    existingSecret: medassist-internal-hmac
    secretKey: keys-json

# ---- 服务间签名校验（MF-07 阶段一）----
# off     = 关闭（仅允许非集群本地联调）
# log     = 校验并打点但不拦截（灰度期用来暴露绕过网关的直连流量）
# enforce = 校验失败 403（staging/production 必须使用）
# 各服务通过环境变量 MEDASSIST_INTERNAL_AUTH_* 绑定，无需改 application.yml。
internalAuth:
  mode: log
  clockSkewSeconds: 60
  nonceTtlSeconds: 120
  # /internal/** 的服务→服务调用是否也要求调用方签名（T5）。
  # 默认 false：先确认 Secret 的 keys-json 已包含 internal.{clinical,emr,insurance,pharmacy,tech}
  # 且全部调用方已升级，再切 true（切换后未配置密钥的调用方会被 403）。
  internalPathsSignatureRequired: false

# ---- 密钥创建（仅本地验证；生产必须用 existingSecret）----
secrets:
  create: false
  postgresUsername: medagent
  postgresPassword: ""
  nacosUsername: nacos
  nacosPassword: ""
  jwtSecret: ""
  empiFieldKey: ""
  empiHashSalt: ""
  # 仅 external.redis.enabled=true 时使用：完整连接串（redis://:密码@host:6379/0）
  redisUrl: ""
  # 服务间内部令牌（≥32 字符）；生产必须由密钥管理注入，不得使用默认值
  internalApiToken: ""
  # 服务间 HMAC 密钥 JSON（仅 secrets.create=true 的本地自验使用）
  internalHmacKeys: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ---- 数据库迁移 Hook（auth / empi 各自的 Flyway 迁移)----
migration:
  enabled: true
  # 迁移 Job 的 Flyway baseline 策略：默认 false（schema 漂移必须让迁移失败，不能被静默 baseline）
  baselineOnMigrate: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 900
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

# ---- 网关 ----
gateway:
  enabled: true
  image:
    repository: platform-gateway
    tag: "0.1.0-SNAPSHOT"
    pullPolicy: IfNotPresent
  replicaCount: 2
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  probes:
    startup: {failureThreshold: 30, periodSeconds: 5}
    liveness: {initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
    readiness: {initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
  # 额外环境变量（K8s 原生 env 列表，支持 valueFrom；同名覆盖 application.yml 默认值）
  env:
    # 可信代理网段（逗号分隔 CIDR）：只有来自这些网段的请求才允许用 X-Forwarded-For 推断客户端 IP。
    # 留空 = 完全不信任 XFF，直接取 TCP 对端地址（安全默认）。
    # 部署在 Ingress 之后时应填 Ingress/节点网段，否则审计与 IP 限速看到的是 Ingress 地址（M3）。
    - name: GATEWAY_TRUSTED_PROXIES
      value: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

