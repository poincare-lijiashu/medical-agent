{{- if .Values.gateway.enabled }}
{{- $kind := include "medassist.workloadKind" (dict "root" $ "component" "gateway") }}
apiVersion: {{ include "medassist.workloadApiVersion" (dict "root" $ "component" "gateway") }}
kind: {{ $kind }}
metadata:
  name: {{ include "medassist.componentName" (dict "root" $ "component" "gateway") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.gateway.revisionHistoryLimit }}
  {{- if eq $kind "Rollout" }}
  {{- include "medassist.canaryStrategy" (dict "root" $ "component" "gateway") | nindent 2 }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 先起新再停旧：网关是在线入口，滚动期间容量不下降
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "medassist.selectorLabels" (dict "root" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medassist.selectorLabels" (dict "root" $ "component" "gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "medassist.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      {{- if .Values.external.skywalking.enabled }}
      initContainers:
        {{- include "medassist.skywalkingInit" (dict "root" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "medassist.image" (dict "root" $ "image" .Values.gateway.image) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # 先摘流再停机：Service/Ingress 的端点收敛有秒级延迟，直接 SIGTERM 会切在途请求（S10）
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          env:
            {{- include "medassist.commonEnv" (dict "root" $ "component" "gateway" "jwt" true "empi" false) | nindent 12 }}
            {{- if .Values.aiCore.enabled }}
            - name: AI_CORE_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "ai-core")) .Values.aiCore.service.port | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: PLATFORM_AUTH_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "auth")) .Values.auth.service.port | quote }}
            {{- end }}
            {{- if .Values.empi.enabled }}
            - name: PLATFORM_EMPI_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "empi")) .Values.empi.service.port | quote }}
            {{- end }}
            {{- if .Values.clinical.enabled }}
            - name: PLATFORM_CLINICAL_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "clinical")) .Values.clinical.service.port | quote }}
            {{- end }}
            {{- if .Values.pharmacy.enabled }}
            - name: PLATFORM_PHARMACY_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "pharmacy")) .Values.pharmacy.service.port | quote }}
            {{- end }}
            {{- if .Values.tech.enabled }}
            - name: PLATFORM_TECH_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "tech")) .Values.tech.service.port | quote }}
            {{- end }}
            {{- if .Values.emr.enabled }}
            - name: PLATFORM_EMR_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "emr")) .Values.emr.service.port | quote }}
            {{- end }}
            {{- if .Values.insurance.enabled }}
            - name: PLATFORM_INSURANCE_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "insurance")) .Values.insurance.service.port | quote }}
            {{- end }}
            {{- if .Values.kb.enabled }}
            - name: PLATFORM_KB_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "kb")) .Values.kb.service.port | quote }}
            {{- end }}
            {{- with .Values.gateway.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.gateway.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.gateway.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ .Values.gateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: {{ .Values.gateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.external.skywalking.enabled }}
            - name: skywalking-agent
              mountPath: /opt/skywalking-agent
              readOnly: true
            {{- end }}
      volumes:
        {{- include "medassist.skywalkingVolume" . | nindent 8 }}
        {{- include "medassist.tmpVolume" . | nindent 8 }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "medassist.podScheduling" (dict "root" $ "component" "gateway") | nindent 6 }}
{{- end }}
