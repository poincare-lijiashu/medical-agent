{{- /*
  Agent 运营告警规则（Prometheus Operator 形态，评审 M-15 / M-6 整改）。

  为什么需要这个模板：
  - deploy/prometheus/medassist-agent-ops.rules.yml 是 **Prometheus 原生 rule_files 格式**，
    只被本地 compose 的 /etc/prometheus/rules/*.yml 挂载消费；
  - K8s Operator 形态下没有任何组件会读它，G97/G102 的规则在集群里一条都不会生效；
  - 本模板把同一组规则以 PrometheusRule CRD 形式部署，开关为
    serviceMonitor.enabled + serviceMonitor.rules.enabled。

  维护约定：本文件与 deploy/prometheus/medassist-agent-ops.rules.yml **必须同步**；
  改阈值/表达式时两处一起改（规则语义以汇总意见书 G97/G102 口径为准）。
  指标来源：/metrics（G105 起同时导出 consult_metrics 与 skill_trends）。
*/}}
{{- if include "medassist.agentRulesEnabled" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "medassist.fullname" . }}-agent-ops
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "monitoring") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: medassist-agent-ops
      rules:
        - alert: MedAssistAgentReplayPassRateLow
          expr: |
            medassist_agent_replay_pass_ratio < 0.8
            and medassist_agent_replay_checks_total >= 3
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "技能候选回放通过率低于 80%"
            description: "当前 {{ "{{" }} $value {{ "}}" }}；请复核候选的问题模式与证据，不要为通过率放宽回放。"

        - alert: MedAssistAgentUnusedPublishedSkills
          expr: medassist_agent_unused_published_skills >= 3
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "存在未被任何 Bot 引用的生效技能"
            description: "当前 {{ "{{" }} $value {{ "}}" }} 个；请评估绑定到合适 Bot 或停用（先看影响面）。"

        - alert: MedAssistAgentProposalBacklog
          expr: medassist_agent_proposals_total{status="proposed"} >= 5
          for: 24h
          labels:
            severity: info
          annotations:
            summary: "技能候选积压"
            description: "当前 {{ "{{" }} $value {{ "}}" }} 个待处理候选；请安排审核。"

        - alert: MedAssistAgentExperienceCoverageLow
          expr: |
            medassist_agent_experience_coverage_ratio < 0.5
            and medassist_agent_experiences_total >= 4
          for: 24h
          labels:
            severity: info
          annotations:
            summary: "经验覆盖率偏低"
            description: "当前 {{ "{{" }} $value {{ "}}" }}；请补充同能力域、同模式的已审核脱敏经验后再提炼。"

        - alert: MedAssistAgentHighOperationalAlerts
          expr: medassist_agent_operational_alerts{level="high"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Agent 运营存在高危告警"
            description: "请登录 Agent 控制台查看告警与运营建议，人工处理。"

        - alert: MedAssistAgentConsultErrorRateHigh
          # 评审 M-24：分母排除 agent="prefilter"（闲聊前置应答零模型、恒成功），
          # 否则真实错误率被系统性稀释。
          # 评审 02-S2：窗口 30m + for 5m，避免"窗口 + for"叠加成约 40 分钟响应时间。
          expr: |
            (
              sum(rate(medassist_agent_consult_requests_total{status="error"}[30m]))
              /
              sum(rate(medassist_agent_consult_requests_total{agent!="prefilter"}[30m]))
            ) > 0.2
            and
            sum(increase(medassist_agent_consult_requests_total{status="error"}[30m])) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "统一问答错误率超过 20%"
            description: "近 30 分钟错误率 {{ "{{" }} $value {{ "}}" }}（已排除前置应答）；请按 reason 标签区分输入非法与模型不可用。"

        - alert: MedAssistAgentMultiWorkerMetrics
          # 评审 M-23：多 worker 下进程内 counter 不可信（只告警形态，不自动处置）
          expr: medassist_agent_metrics_worker_count > 1
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "AI 中台以多 worker 运行，问答计量不可信"
            description: "当前 {{ "{{" }} $value {{ "}}" }} 个 worker；请固定单 worker 或改用多进程聚合。"

        - alert: MedAssistAgentConsultAbortedSpike
          expr: sum(increase(medassist_agent_consult_requests_total{status="aborted",agent!="prefilter"}[30m])) >= 5
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "统一问答中止次数偏高"
            description: "近 30 分钟客户端中止 {{ "{{" }} $value {{ "}}" }} 次；可能是主动停止或链路超时，请结合网关日志排查。"

        # ---- 评审 02-S1：抓取失败 / token 成本 / token 采集率 ----
        - alert: MedAssistAgentMetricsAbsent
          expr: absent(medassist_agent_metrics_worker_count)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "AI 中台指标完全缺失（抓取失败或令牌不匹配）"
            description: "连续 10 分钟未采到任何 medassist_agent_* 指标；请检查 METRICS_TOKEN 与 /metrics 鉴权。"

        - alert: MedAssistAgentScrapeDown
          # 本地 compose 的 job 名为 medassist-ai-core；K8s 以 ServiceMonitor 的 job 标签为准，
          # 跨形态兜底由 MedAssistAgentMetricsAbsent 承担。
          expr: up{job="medassist-ai-core"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "AI 中台抓取目标 down"
            description: "Prometheus 无法抓取 /metrics；请检查网络、鉴权与目标地址（target={{ "{{" }} $labels.instance {{ "}}" }}）。"

        - alert: MedAssistAgentTokenBudgetHigh
          # 总量/趋势必须用 increase()，不要裸 sum(counter)（进程重启会归零）。
          expr: sum(increase(medassist_agent_consult_tokens_total[1h])) > 300000
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "最近 1 小时 token 用量超过 30 万"
            description: "当前 {{ "{{" }} $value {{ "}}" }} token/小时；请确认是否为异常批量调用。"

        - alert: MedAssistAgentTokenUsageCoverageLow
          expr: |
            (
              sum(increase(medassist_agent_consult_tokenized_requests_total[1h]))
              /
              sum(increase(medassist_agent_consult_requests_total{status="ok",agent!="prefilter"}[1h]))
            ) < 0.5
            and
            sum(increase(medassist_agent_consult_requests_total{status="ok",agent!="prefilter"}[1h])) >= 20
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "token 用量采集覆盖率低于 50%"
            description: "近 1 小时仅 {{ "{{" }} $value {{ "}}" }} 的成功问答返回了 usage；请检查 provider/模型响应结构（本平台不估算 token）。"

        - alert: MedAssistAgentAnswerQualityLow
          expr: |
            (
              sum(increase(medassist_agent_answer_quality_total{signal=~"short|no_evidence|refusal"}[1h]))
              /
              sum(increase(medassist_agent_consult_requests_total{status="ok",agent!="prefilter"}[1h]))
            ) > 0.3
            and
            sum(increase(medassist_agent_consult_requests_total{status="ok",agent!="prefilter"}[1h])) >= 20
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "回答质量风险信号占比超过 30%"
            description: "近 1 小时 {{ "{{" }} $value {{ "}}" }} 的成功回答命中过短/缺证据/疑似拒答；请按 agent 与 signal 标签复查提示模板与模型输出。"

        - alert: MedAssistAgentConsultLatencyP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(medassist_agent_consult_duration_seconds_bucket{channel="sync"}[30m]))
            ) > 20
            and
            sum(rate(medassist_agent_consult_duration_seconds_count{channel="sync"}[30m])) > 0.02
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "同步问答 P95 时延超过 20 秒"
            description: "近 30 分钟 P95={{ "{{" }} $value {{ "}}" }}s；请检查模型队列、并发闸门与上游 provider 状态。"

        - alert: MedAssistAgentSkillLabelOverflow
          expr: medassist_agent_skill_labels_overflow > 0
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "技能标签基数溢出（新技能被归入 __other__）"
            description: "当前 {{ "{{" }} $value {{ "}}" }} 个不同技能编码已被归并；请评估提升 MAX_SKILL_LABELS 或清理长期未用技能卡。"

        # 第 49 批：按域 stale（PG 写失败回落 JSON）——多副本漂移的早期信号。
        - alert: MedAssistAgentStorageStaleDomains
          expr: sum by (instance) (medassist_agent_storage_stale_domains) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Agent 存储存在写失败回落 JSON 的域"
            description: "{{ "{{" }} $value {{ "}}" }} 个域处于 stale；请在该实例执行上线自检并检查 PG 连接。"

        - alert: MedAssistAgentStorageNotPg
          expr: |
            (
              medassist_agent_storage_ready == 0
              or
              medassist_agent_storage_circuit_open == 1
            )
            unless on(instance) medassist_agent_storage_mode{mode="offline"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Agent 存储未使用 PG 真源"
            description: "该实例 PG 池不可用且非显式离线模式；多副本下会与其他实例数据互不可见，请立即检查 PG 与网络。"

        # 第 67 批：共享存储（Redis）降级——限流/撤销退回本实例内存，多副本语义失效但服务仍 200。
        - alert: MedAssistRedisDegraded
          expr: medassist_agent_redis_enabled == 1 and medassist_agent_redis_degraded == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "共享存储（Redis）降级：{{ "{{" }} $labels.instance {{ "}}" }}"
            description: "该实例已回落本实例内存镜像，多副本限流/令牌撤销不再共享。查 redis.degraded 日志、Redis 可达性，以及是否漏装 redis 依赖（import_missing）。"
{{- end }}
