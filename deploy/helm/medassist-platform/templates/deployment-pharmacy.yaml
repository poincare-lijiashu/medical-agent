{{- if .Values.pharmacy.enabled }}
{{- $kind := include "medassist.workloadKind" (dict "root" $ "component" "pharmacy") }}
apiVersion: {{ include "medassist.workloadApiVersion" (dict "root" $ "component" "pharmacy") }}
kind: {{ $kind }}
metadata:
  name: {{ include "medassist.componentName" (dict "root" $ "component" "pharmacy") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "pharmacy") | nindent 4 }}
spec:
  {{- if not .Values.pharmacy.autoscaling.enabled }}
  replicas: {{ .Values.pharmacy.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.pharmacy.revisionHistoryLimit }}
  {{- if eq $kind "Rollout" }}
  {{- include "medassist.canaryStrategy" (dict "root" $ "component" "pharmacy") | nindent 2 }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "medassist.selectorLabels" (dict "root" $ "component" "pharmacy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medassist.selectorLabels" (dict "root" $ "component" "pharmacy") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "medassist.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.pharmacy.terminationGracePeriodSeconds }}
      {{- if .Values.external.skywalking.enabled }}
      initContainers:
        {{- include "medassist.skywalkingInit" (dict "root" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: pharmacy
          image: {{ include "medassist.image" (dict "root" $ "image" .Values.pharmacy.image) }}
          imagePullPolicy: {{ .Values.pharmacy.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          ports:
            - name: http
              containerPort: {{ .Values.pharmacy.service.port }}
              protocol: TCP
          env:
            {{- include "medassist.commonEnv" (dict "root" $ "component" "pharmacy" "jwt" false "empi" false) | nindent 12 }}
            {{- if .Values.empi.enabled }}
            # 患者主索引内网地址（不经网关；内部接口仍要求令牌）
            - name: EMPI_INTERNAL_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "empi")) .Values.empi.service.port | quote }}
            {{- end }}
            {{- if .Values.clinical.enabled }}
            # 发药计费/退药冲减：收费域内网直连（仅 billing_mode=DISPENSE 的处方使用）
            - name: CLINICAL_INTERNAL_URI
              value: {{ printf "http://%s:%v" (include "medassist.componentName" (dict "root" $ "component" "clinical")) .Values.clinical.service.port | quote }}
            {{- end }}
            # 服务间令牌：须与 EMPI 的 INTERNAL_API_TOKEN 一致
            - name: PHARMACY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.internalApi.existingSecret }}
                  key: {{ .Values.external.internalApi.secretKey }}
            {{- with .Values.pharmacy.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.pharmacy.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.pharmacy.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ .Values.pharmacy.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pharmacy.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.pharmacy.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.pharmacy.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: {{ .Values.pharmacy.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pharmacy.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.pharmacy.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.pharmacy.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.pharmacy.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.external.skywalking.enabled }}
            - name: skywalking-agent
              mountPath: /opt/skywalking-agent
              readOnly: true
            {{- end }}
      volumes:
        {{- include "medassist.skywalkingVolume" . | nindent 8 }}
        {{- include "medassist.tmpVolume" . | nindent 8 }}
      {{- with .Values.pharmacy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pharmacy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "medassist.podScheduling" (dict "root" $ "component" "pharmacy") | nindent 6 }}
{{- end }}
