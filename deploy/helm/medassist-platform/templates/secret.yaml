{{- /*
  密钥创建（仅本地/kind 自验）。
  生产必须 secrets.create=false 并使用外部 Secret：
    medassist-postgres  {username, password}
    medassist-nacos     {username, password}
    medassist-jwt       {secret}
    medassist-empi      {field-key, hash-salt}
    medassist-internal  {token}       # 服务间内部接口令牌
    medassist-internal-hmac {keys-json, gateway-private-key, gateway-public-key, <caller>...}
                                      # 服务间签名密钥集（MF-07 阶段一/二）
    medassist-redis     {url}   # 仅 external.redis.enabled=true 时使用
*/ -}}
{{- if .Values.secrets.create }}
{{- $ia := .Values.internalAuth | default dict }}
{{- if $ia.mountCallerKeys }}
{{- $provided := .Values.secrets.internalCallerKeys | default dict }}
{{- range $component, $callers := ($ia.callerKeys | default dict) }}
{{- range $caller := $callers }}
{{- if not (hasKey $provided $caller) }}
{{- fail (printf "secrets.internalCallerKeys 缺少 %s（组件 %s 需要该调用方密钥）" $caller $component) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medassist.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "database") | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "secrets.postgresUsername 必填（secrets.create=true 时）" .Values.secrets.postgresUsername | quote }}
  password: {{ required "secrets.postgresPassword 必填（secrets.create=true 时）" .Values.secrets.postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medassist.fullname" . }}-nacos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "nacos") | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "secrets.nacosUsername 必填（secrets.create=true 时）" .Values.secrets.nacosUsername | quote }}
  password: {{ required "secrets.nacosPassword 必填（secrets.create=true 时）" .Values.secrets.nacosPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medassist.fullname" . }}-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "jwt") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.external.jwt.secretKey }}: {{ required "secrets.jwtSecret 必填（secrets.create=true 且须 ≥32 字节）" .Values.secrets.jwtSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medassist.fullname" . }}-empi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "empi") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.external.empi.secretKeys.fieldKey }}: {{ required "secrets.empiFieldKey 必填（secrets.create=true 时）" .Values.secrets.empiFieldKey | quote }}
  {{ .Values.external.empi.secretKeys.hashSalt }}: {{ required "secrets.empiHashSalt 必填（secrets.create=true 时）" .Values.secrets.empiHashSalt | quote }}
{{- if .Values.external.redis.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.external.redis.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "ai-core") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.external.redis.secretKey }}: {{ required "secrets.redisUrl 必填（external.redis.enabled=true 且 secrets.create=true 时；形如 redis://:密码@host:6379/0）" .Values.secrets.redisUrl | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.external.internalApi.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "clinical") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.external.internalApi.secretKey }}: {{ required "secrets.internalApiToken 必填（secrets.create=true 时；≥32 字符）" .Values.secrets.internalApiToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.external.internalHmac.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "gateway") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.external.internalHmac.secretKey }}: {{ required "secrets.internalHmacKeys 必填（secrets.create=true 时；JSON 形如 active + keys，示例见 values-dev.yaml）" .Values.secrets.internalHmacKeys | quote }}
  {{- $ia := .Values.internalAuth | default dict }}
  {{- if eq (toString ($ia.gatewaySigning | default "hmac")) "ed25519" }}
  {{ .Values.external.internalHmac.gatewayPrivateKeySecretKey }}: {{ required "secrets.internalHmacGatewayPrivateKey 必填（gatewaySigning=ed25519 且 secrets.create=true 时）" .Values.secrets.internalHmacGatewayPrivateKey | quote }}
  {{- end }}
  {{- if or $ia.acceptEd25519 (eq (toString ($ia.gatewaySigning | default "hmac")) "ed25519") }}
  {{ .Values.external.internalHmac.gatewayPublicKeySecretKey }}: {{ required "secrets.internalHmacGatewayPublicKey 必填（acceptEd25519=true 或 gatewaySigning=ed25519 且 secrets.create=true 时）" .Values.secrets.internalHmacGatewayPublicKey | quote }}
  {{- end }}
  {{- if $ia.mountCallerKeys }}
  {{- range $caller, $key := (.Values.secrets.internalCallerKeys | default dict) }}
  {{ $caller }}: {{ required (printf "secrets.internalCallerKeys.%s 不能为空（mountCallerKeys=true 时）" $caller) $key | quote }}
  {{- end }}
  {{- end }}
{{- end }}
