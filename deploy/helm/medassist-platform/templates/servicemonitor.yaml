{{- /*
  Prometheus Operator 抓取（可选）。
  1) Java 服务（gateway/auth/...）：/actuator/prometheus 由 micrometer 提供；
  2) AI 中台（ai-core）：/metrics 需 admin JWT 或抓取专用静态令牌（G105）。
     启用 serviceMonitor.aiCore 前先创建同 namespace 的 Secret，并在
     aiCore deployment 注入同一个 METRICS_TOKEN（见 deployment-ai-core.yaml）。
*/}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "medassist.fullname" . }}-java
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "monitoring") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "medassist.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["gateway", "auth", "empi", "clinical", "pharmacy", "material", "tech", "emr", "insurance", "kb"]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # 打上 component 标签：告警与灰度分析都按它过滤（否则只有共享的 job 名，
      # 无法区分 gateway/auth/empi，也无法定位到具体服务的 5xx —— 见 M10/M11）
      relabelings:
        - sourceLabels: ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          targetLabel: component
        - sourceLabels: ["__meta_kubernetes_pod_label_rollouts_pod_template_hash"]
          targetLabel: rollouts_pod_template_hash
{{- if and .Values.aiCore.enabled .Values.serviceMonitor.aiCore.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "medassist.fullname" . }}-ai-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "monitoring") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "medassist.selectorLabels" (dict "root" $ "component" "ai-core") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ required "serviceMonitor.aiCore.tokenSecretName 必填（抓取令牌 Secret）" .Values.serviceMonitor.aiCore.tokenSecretName }}
          key: {{ .Values.serviceMonitor.aiCore.tokenSecretKey }}
      relabelings:
        - targetLabel: component
          replacement: ai-core
{{- end }}
{{- end }}
