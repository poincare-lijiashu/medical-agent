{{- /*
  网络策略：默认只约束入站（Ingress）。出站（Egress）默认放行——业务需要访问 PG/Nacos/
  Milvus/模型网关，若在 Chart 内硬编码出站 CIDR，换网络即断服；出站隔离默认由集群
  基础设施层按命名空间统一治理（平台组职责）。

  例外：networkPolicy.egress.enabled=true 时，对 ai-core 追加出站白名单（仅集群 DNS +
  私网 CIDR），用于"从网络层保证运行时不连公网"（HuggingFace/PubMed 等）。这是可选项，
  因为一旦集群网段与 allowedCidrs 不符会直接断服——必须先在 staging 验证再上 prod。

  信任链：客户端 → Ingress Controller → 网关 → auth/empi/ai-core；服务端口不对
  Ingress 直接暴露，业务服务只接受同命名空间网关 Pod 的访问。
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- if .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medassist.componentName" (dict "root" $ "component" "gateway") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "medassist.selectorLabels" (dict "root" $ "component" "gateway") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port }}
---
{{- end }}
{{- range $component := list "auth" "empi" "clinical" "pharmacy" "material" "tech" "emr" "insurance" "kb" "fhir" "masterdata" }}
{{- $svc := index $.Values $component }}
{{- if $svc.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medassist.componentName" (dict "root" $ "component" $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "medassist.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # 同命名空间内的网关 Pod（namespaceSelector + podSelector 为 AND 语义）
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "gateway") | nindent 14 }}
        {{- if eq $component "empi" }}
        # 第 174 批：AI 中台读取患者主索引（EMPI 唯一真源），同命名空间内网直连、
        # 不经网关（/internal/** 网关永久 404），仍要求 X-Internal-Token。
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "ai-core") | nindent 14 }}
        # 临床核心与药房直接调用 EMPI 内部患者接口（服务间直连，不经网关）
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "clinical") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "pharmacy") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "tech") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "emr") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "insurance") | nindent 14 }}
        {{- end }}
        {{- if eq $component "clinical" }}
        # 病历域读取入院时间（书写时限质控）、医保域拉取收费明细，均走内网内部接口
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "emr") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "insurance") | nindent 14 }}
        # 药房回写发药计费/退药冲减（pharmacy → clinical /internal/pharmacy-charges）
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "pharmacy") | nindent 14 }}
        {{- end }}
        {{- if or (eq $component "pharmacy") (eq $component "tech") }}
        # 临床直连药房建处方、直连医技建检查/检验申请（不经网关）。
        # 漏这一段时 prod 开 NetworkPolicy 后链路只会超时，不会报明确的鉴权错误（P0-6）。
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "clinical") | nindent 14 }}
        {{- end }}
        {{- if eq $component "emr" }}
        # 医保域 DRG 模拟分组读取病案首页手术操作（第六轮 MF-10：prod 开了 NetworkPolicy，缺此段必 403/超时）
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "insurance") | nindent 14 }}
        # 临床域出院体检核查病历/病案首页归档（/internal/records/by-visit/*/archive-summary）
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "clinical") | nindent 14 }}
        {{- end }}
        - namespaceSelector:
            {{- toYaml $.Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ $svc.service.port }}
---
{{- end }}
{{- end }}
{{- if .Values.dataMigration.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medassist.componentName" (dict "root" $ "component" "migration") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "migration") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "medassist.selectorLabels" (dict "root" $ "component" "migration") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # 只允许网关进入：迁移是高危操作，不允许业务 Pod 直连调用"改历史数据"
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "gateway") | nindent 14 }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.dataMigration.service.port }}
---
{{- end }}
{{- if .Values.aiCore.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medassist.componentName" (dict "root" $ "component" "ai-core") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "medassist.labels" (dict "root" $ "component" "ai-core") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "medassist.selectorLabels" (dict "root" $ "component" "ai-core") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "medassist.selectorLabels" (dict "root" $ "component" "gateway") | nindent 14 }}
        # 前端静态资源与 SSE 直连（/api/v1、/）经 Ingress Controller 进入
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.aiCore.service.port }}
  {{- if $egress.enabled }}
  egress:
    # 1) 集群 DNS（否则一切服务名解析失败，且故障现象极具迷惑性）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $egress.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2) 私网 CIDR 全端口：PG/Redis/Nacos/Milvus/OAP/院内 LLM 网关
    #    公网目标不在白名单内 → 被拒（HF/PubMed 等运行时下载从网络层兜死）
    - to:
        {{- range $egress.allowedCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
  {{- end }}
{{- end }}
{{- end }}
