<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="MedAssist 铭医 · 医院临床协同平台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1512"/>
      <stop offset="55%" stop-color="#0f211c"/>
      <stop offset="100%" stop-color="#122b25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f9e83"/>
      <stop offset="100%" stop-color="#7fd8bf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3a33" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1120" cy="60" r="190" fill="#1f6f5c" opacity="0.22" filter="url(#glow)"/>
  <rect x="0" y="0" width="6" height="340" fill="url(#accent)"/>

  <!-- mark -->
  <g transform="translate(72,64)">
    <rect width="44" height="44" rx="12" fill="#123a31" stroke="#2f9e83" stroke-width="1.5"/>
    <path d="M22 11v22M11 22h22" stroke="#7fd8bf" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <text x="132" y="90" font-family="IBM Plex Sans, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="40" font-weight="700" fill="#eaf5f1" letter-spacing="0.5">铭医 MedAssist</text>
  <text x="132" y="126" font-family="IBM Plex Sans, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="17" fill="#8fb8ab">医院级临床协同平台 · 医嘱闭环 · 医保结算 · AI 循证问答 · 私有化交付</text>

  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#a9d6c8">
    <rect x="72" y="168" width="258" height="46" rx="10" fill="#0f241f" stroke="#22473d"/>
    <text x="90" y="188" fill="#6ea898" font-size="11" letter-spacing="1.2">SERVICES</text>
    <text x="90" y="207" font-size="17" fill="#eaf5f1">16</text>
    <text x="140" y="207" font-size="11" fill="#7fb3a2">独立领域服务</text>

    <rect x="346" y="168" width="258" height="46" rx="10" fill="#0f241f" stroke="#22473d"/>
    <text x="364" y="188" fill="#6ea898" font-size="11" letter-spacing="1.2">HTTP API</text>
    <text x="364" y="207" font-size="17" fill="#eaf5f1">913</text>
    <text x="414" y="207" font-size="11" fill="#7fb3a2">Java 端点</text>

    <rect x="620" y="168" width="258" height="46" rx="10" fill="#0f241f" stroke="#22473d"/>
    <text x="638" y="188" fill="#6ea898" font-size="11" letter-spacing="1.2">SCHEMAS / TABLES</text>
    <text x="638" y="207" font-size="17" fill="#eaf5f1">15 / 334</text>
    <text x="716" y="207" font-size="11" fill="#7fb3a2">按域隔离</text>

    <rect x="894" y="168" width="314" height="46" rx="10" fill="#0f241f" stroke="#22473d"/>
    <text x="912" y="188" fill="#6ea898" font-size="11" letter-spacing="1.2">TESTS PASSING</text>
    <text x="912" y="207" font-size="17" fill="#eaf5f1">2,140</text>
    <text x="972" y="207" font-size="11" fill="#7fb3a2">Python（非 e2e）</text>
  </g>

  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#5f8a7d">
    <text x="72" y="268">Java 21 · Spring Boot 4 · Vue 3.5 · FastAPI · PostgreSQL · Redis · Milvus · FHIR R4 · HL7 v2</text>
    <text x="72" y="292">fail-closed by default · 追加式审计 · 四眼审批 · 租户隔离 · 国产/本地模型优先</text>
  </g>

  <g transform="translate(1030,258)">
    <rect width="178" height="34" rx="17" fill="none" stroke="#2f6f5f"/>
    <text x="89" y="22" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace"
          font-size="12" fill="#7fd8bf">PRIVATE FIRST · 2026</text>
  </g>
</svg>
