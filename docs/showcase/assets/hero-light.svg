  </text>
  <text x="72" y="278" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="19" fill="#4a625b">
    每一条链路都可审计、可回滚、可追溯
  </text>

  <!-- meta line -->
  <text x="72" y="318" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" font-size="12.5" letter-spacing="0.6"
        fill="#8a9d97">Java 21 · Spring Boot 4 · Vue 3.5 · FastAPI · PostgreSQL · FHIR R4</text>

  <!-- stats -->
  <rect x="72" y="392" width="146" height="76" rx="12" fill="#f5faf8" stroke="#d7e6e0"/><text x="92" y="432" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" font-size="27" font-weight="700" fill="#0d1f1a">16</text><text x="92" y="454" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="13" fill="#8a9d97">领域服务</text><rect x="230" y="392" width="146" height="76" rx="12" fill="#f5faf8" stroke="#d7e6e0"/><text x="250" y="432" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" font-size="27" font-weight="700" fill="#0d1f1a">913</text><text x="250" y="454" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="13" fill="#8a9d97">HTTP 端点</text><rect x="388" y="392" width="146" height="76" rx="12" fill="#f5faf8" stroke="#d7e6e0"/><text x="408" y="432" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" font-size="27" font-weight="700" fill="#0d1f1a">334</text><text x="408" y="454" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="13" fill="#8a9d97">数据表</text><rect x="546" y="392" width="146" height="76" rx="12" fill="#f5faf8" stroke="#d7e6e0"/><text x="566" y="432" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" font-size="27" font-weight="700" fill="#0d1f1a">2,140</text><text x="566" y="454" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="13" fill="#8a9d97">测试通过</text>

