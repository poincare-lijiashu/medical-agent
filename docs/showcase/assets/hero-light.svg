<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640"
     viewBox="0 0 1280 640" role="img"
     aria-label="铭医 MedAssist 医院级临床协同平台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f7f5"/>
    </linearGradient>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6f5c"/>
      <stop offset="100%" stop-color="#0f5546" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6efeb" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="6" height="640" fill="url(#accentline)"/>

  <!-- brand -->
  <rect x="72" y="72" width="44" height="44" rx="13" fill="#ffffff" stroke="#1f6f5c"/>
  <path d="M94 84v20M84 94h20" stroke="#0f5546" stroke-width="3.4" stroke-linecap="round"/>
  <text x="132" y="92" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" font-size="14" letter-spacing="4.2"
        fill="#8a9d97">MEDASSIST</text>
  <text x="132" y="112" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="15" fill="#4a625b">铭医 · 医院临床协同平台</text>

  <!-- headline -->
  <text x="72" y="204" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="52" font-weight="700"
        letter-spacing="-1.2" fill="#0d1f1a">医院级临床协同平台</text>
  <text x="72" y="248" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="19" fill="#4a625b">
