<h1>急性阑尾炎诊治规范</h1>
<p>急性阑尾炎是外科最常见的急腹症，典型表现为<b>转移性右下腹痛</b>、麦氏点压痛与反跳痛。</p>
<p>诊断要点：白细胞计数升高&nbsp;伴中性粒细胞比例增高；超声可见阑尾增粗、周围渗出。</p>
<div class="note">鉴别诊断：右侧输尿管结石、妇科急腹症、消化性溃疡穿孔。</div>
<p>治疗原则：确诊后应尽早行阑尾切除术；围手术期使用头孢类抗菌药物预防感染。</p>
